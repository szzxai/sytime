name: Public repository safety

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the scanner
        run: node --test tests/public-safety.test.mjs
      - name: Check source files and reachable history
        run: node tools/public-safety.mjs --history
      - name: Scan credentials with Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --log-opts=--all --redact --no-banner
