<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5F3EE" />
    <title>登录 · 校园信息网</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/site.css" />
  </head>
  <body>
    <noscript
      ><div class="alert alert--warning">
        <div class="alert__body">本站需要启用 JavaScript 才能正常使用。</div>
      </div></noscript
    >
    <a class="skip-link" href="#main">跳到正文</a>
    <div id="siteBanner"></div>
    <div id="siteHeader"></div>
    <main id="main" class="auth container container--narrow">
      <div class="card auth-card">
        <div class="auth-card__brand">
          <svg class="brand__mark" aria-hidden="true">
            <use href="/img/icons.svg#brand-mark"></use>
          </svg>
        </div>
        <h1 class="auth-card__title">欢迎回来</h1>
        <p class="auth-card__desc">登录后即可发帖、评价和管理个人设置</p>

        <form id="loginForm" class="form" autocomplete="on" novalidate>
          <div id="loginAlert" hidden></div>
          <div class="field">
            <label class="field__label" for="username">用户名</label>
            <input
              class="input"
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              enterkeyhint="go"
              required
            />
          </div>
          <div class="field">
            <label class="field__label" for="password">密码</label>
            <div class="input-group">
              <input
                class="input input--end"
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                enterkeyhint="go"
                required
              />
              <div class="input-group__end">
                <button
                  type="button"
                  class="icon-btn icon-btn--sm"
                  data-password-toggle
                  aria-label="显示密码"
                >
                  <svg class="icon" aria-hidden="true">
                    <use href="/img/icons.svg#i-eye"></use>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <button
            type="submit"
            class="btn btn--primary btn--lg btn--block"
            id="submitBtn"
          >
            登录
          </button>
        </form>

        <div class="auth-card__section" id="appealBox" hidden>
          <h2 class="form__group-title">申请解封</h2>
          <div
            class="field"
            data-upload
            data-max-mb="2"
            data-types="image/jpeg,image/png"
          >
            <label class="field__label" for="appealReason">申诉理由</label>
            <textarea
              class="textarea"
              id="appealReason"
              placeholder="请说明情况，以便管理员审核"
              data-counter="500"
            ></textarea>
            <div class="field__foot">
              <span class="field__hint"
                >重复提交将覆盖上一次申请；10 分钟内只能提交一次。</span
              ><span class="field__counter"></span>
            </div>
          </div>
          <div
            class="field"
            data-upload
            data-max-mb="2"
            data-types="image/jpeg,image/png"
          >
            <span class="field__label"
              >上传图片 <span class="field__opt">（选填）</span></span
            >
            <label class="upload"
              ><span class="upload__icon"
                ><svg class="icon icon--lg" aria-hidden="true">
                  <use href="/img/icons.svg#i-image"></use></svg></span
              ><span class="upload__title">点击选择图片</span
              ><span class="upload__hint">JPG / PNG，不超过 2 MB</span
              ><input
                aria-label="上传图片"
                type="file"
                id="appealImageInput"
                accept="image/jpeg,image/png"
            /></label>
            <div class="upload-preview-slot"></div>
          </div>
          <button type="button" class="btn btn--block" id="appealSubmit">
            提交申诉
          </button>
        </div>

        <p class="auth-card__switch">
          还没有账号？<a href="register.html">立即注册</a>
        </p>
      </div>
    </main>
    <div id="siteFooter"></div>
    <script src="/js/ui.js"></script>
    <script src="/js/page.js"></script>

    <script src="/js/pages/login.js"></script>
  </body>
</html>
