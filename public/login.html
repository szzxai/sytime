<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 校园信息网</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
    color: #000000;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #000000;
    padding: 16px 32px;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .nav {
    display: flex;
    gap: 24px;
  }
  .nav a {
    color: #000000;
    text-decoration: none;
    font-size: 16px;
    padding: 6px 4px;
    border-bottom: 2px solid transparent;
  }
  .nav a:hover {
    border-bottom: 2px solid #000000;
  }
  .auth {
    display: flex;
    gap: 8px;
  }
  .btn {
    display: inline-block;
    background: #ffffff;
    color: #000000;
    border: 2px solid #000000;
    border-radius: 0;
    padding: 8px 14px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    line-height: 1;
  }
  .btn:hover { background: #000000; color: #ffffff; }
  .main {
    display: flex;
    justify-content: center;
    padding: 56px 16px;
  }
  .card {
    width: 360px;
    max-width: 100%;
    border: 2px solid #000000;
    padding: 28px;
  }
  .card h1 {
    font-size: 22px;
    letter-spacing: 2px;
    margin: 0 0 22px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    color: #555555;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    border: 2px solid #000000;
    border-radius: 0;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: #000000;
    background: #ffffff;
    outline: none;
  }
  .field input:focus { background: #f2f2f2; }
  .submit {
    width: 100%;
    background: #000000;
    color: #ffffff;
    border: 2px solid #000000;
    border-radius: 0;
    padding: 11px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
  }
  .submit:hover { background: #ffffff; color: #000000; }
  .submit:disabled { opacity: 0.5; cursor: default; }
  .msg {
    min-height: 20px;
    font-size: 13px;
    margin-top: 14px;
  }
  .msg.error { color: #cc0000; }
  .msg.ok { color: #008800; }
  .switch {
    margin-top: 18px;
    font-size: 13px;
    text-align: center;
  }
  .switch a { color: #000000; }
</style>
</head>
<body>
  <header class="header">
    <div class="logo">校园信息网</div>
    <div class="header-right">
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="map.html">校园地图</a>
        <a href="forum.html">论坛</a>
        <a href="recipe.html">菜谱评价</a>
      </nav>
      <div class="auth" id="authArea">
        <a class="btn" href="login.html">登录</a>
        <a class="btn" href="register.html">注册</a>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="card">
      <h1>登录</h1>
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="submit" id="submitBtn">登录</button>
        <div class="msg" id="msg"></div>
      </form>
      <div class="switch">还没有账号？<a href="register.html">立即注册</a></div>
    </div>
  </main>

  <script>
    var form = document.getElementById("loginForm");
    var msg = document.getElementById("msg");
    var submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var username = document.getElementById("username").value.trim();
      var password = document.getElementById("password").value;

      msg.className = "msg";
      msg.textContent = "登录中…";
      submitBtn.disabled = true;

      fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username, password: password })
      })
        .then(function (res) {
          return res.json().then(function (data) {
            return { ok: res.ok, data: data };
          });
        })
        .then(function (r) {
          if (!r.ok) {
            msg.className = "msg error";
            msg.textContent = r.data.error === "invalid username or password" ? "用户名或密码错误" : (r.data.error || "登录失败");
            submitBtn.disabled = false;
            return;
          }
          localStorage.setItem("token", r.data.token);
          localStorage.setItem("user", JSON.stringify(r.data.user));
          msg.className = "msg ok";
          msg.textContent = "登录成功，正在跳转…";
          setTimeout(function () { location.href = "index.html"; }, 600);
        })
        .catch(function (err) {
          msg.className = "msg error";
          msg.textContent = "网络错误：" + err.message;
          submitBtn.disabled = false;
        });
    });
  </script>
  <script src="auth.js"></script>
</body>
</html>
