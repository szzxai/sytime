<!doctype html>
<html lang="zh-CN">
  <head>
  <script src="/js/page-transition.js"></script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#218653" />
    <title>菜品与食谱 · 拾光酥糕</title>
    <link rel="icon" href="/img/brand-lime.svg?v=20261019" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/site.css?v=shstime-20261024-dishes" />
  </head>
  <body data-page="recipe" data-nav="recipe">
    <noscript
      ><div class="alert alert--warning">
        <div class="alert__body">本站需要启用 JavaScript 才能正常使用。</div>
      </div></noscript
    >
    <a class="skip-link" href="#main">跳到正文</a>
    <div id="siteBanner"></div>
    <div id="siteHeader"></div>
    <main id="main" class="workspace workspace--recipe">
      <aside class="workspace__sidebar" aria-label="菜谱浏览">
      <div class="page-head">
        <div class="page-head__main">
          <span class="page-head__eyebrow">每天的好味道</span>
          <h1 class="page-head__title">菜品与食谱</h1>
        </div>
      </div>

      <div class="segmented u-mb-6" role="tablist" aria-label="视图">
        <button
          type="button"
          class="segmented__item"
          role="tab"
          id="allBtn"
          data-view="all"
          aria-selected="true"
        >
          全部菜品
        </button>
        <button type="button" class="segmented__item" role="tab" id="reviewsBtn" data-view="reviews" aria-selected="false">菜品评价</button>
        <button
          type="button"
          class="segmented__item"
          role="tab"
          id="weeklyBtn"
          data-view="weekly"
          aria-selected="false"
        >
          每周食谱
        </button>
      </div>

      <div class="page-head__actions" id="writeAction" hidden>
        <button type="button" class="btn btn--primary" id="writeBtn">
          <svg class="icon" aria-hidden="true">
            <use href="/img/icons.svg#i-pencil"></use></svg
          >写评价
        </button>
      </div>

      <section id="dishSearchArea" hidden aria-label="搜索菜品">
        <div class="search-bar u-mb-4">
          <div class="input-group">
            <span class="input-group__icon"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#i-search"></use></svg></span>
            <input class="input input--icon input--end" type="search" id="dishSearch" placeholder="搜索菜名、拼音或首字母…" aria-label="搜索菜品" enterkeyhint="search" />
            <span class="input-group__end" id="searchClearWrap" hidden><button type="button" class="icon-btn icon-btn--sm" id="dishSearchClear" aria-label="清除搜索"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#i-close"></use></svg></button></span>
          </div>
        </div>
        <p class="u-muted u-fs-sm u-mb-4" id="dishSummary" role="status"></p>
        <span class="sr-only" aria-live="polite" id="dishSearchLive"></span>
      </section>

      <div class="callout" id="loginHint" hidden>
        <span class="callout__text">登录后才能写评价。</span>
        <span class="callout__actions"
          ><a class="btn btn--sm" href="login.html">登录</a
          ><a class="btn btn--primary btn--sm" href="register.html"
            >注册</a
          ></span
        >
      </div>

      </aside>
      <div class="workspace__content">
      <div id="recipeList" role="tabpanel" aria-labelledby="allBtn"></div>
      <nav class="az-rail" id="dishRail" aria-label="菜品字母索引" hidden></nav>
      <div class="load-more" id="loadMore" hidden>
        <button type="button" class="btn" id="moreBtn">加载更多</button
        ><span id="moreInfo"></span>
      </div>

      </div>
    </main>
    <div id="siteFooter"></div>
    <script src="/js/ui.js?v=shstime-20261019"></script>
    <script src="/js/page.js"></script>
    <script src="/js/dish-review.js?v=20261024-picker50"></script>
    <script src="/js/pages/recipe.js?v=20261024-dishes"></script>
  </body>
</html>
