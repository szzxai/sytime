<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5F3EE" />
    <title>菜谱评价 · 校园信息网</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/site.css" />
  </head>
  <body data-nav="recipe">
    <noscript
      ><div class="alert alert--warning">
        <div class="alert__body">本站需要启用 JavaScript 才能正常使用。</div>
      </div></noscript
    >
    <a class="skip-link" href="#main">跳到正文</a>
    <div id="siteBanner"></div>
    <div id="siteHeader"></div>
    <main id="main" class="main container">
      <div class="page-head">
        <div class="page-head__main">
          <span class="page-head__eyebrow">Canteen</span>
          <h1 class="page-head__title">菜谱评价</h1>
        </div>
        <div class="page-head__actions" id="writeAction">
          <button type="button" class="btn btn--primary" id="writeBtn">
            <svg class="icon" aria-hidden="true">
              <use href="/img/icons.svg#i-pencil"></use></svg
            >写评价
          </button>
        </div>
      </div>

      <div class="segmented u-mb-6" role="tablist" aria-label="视图">
        <button
          type="button"
          class="segmented__item"
          role="tab"
          id="allBtn"
          data-view="all"
          aria-selected="true"
        >
          全部菜品
        </button>
        <button
          type="button"
          class="segmented__item"
          role="tab"
          id="weeklyBtn"
          data-view="weekly"
          aria-selected="false"
        >
          每周食谱
        </button>
      </div>

      <div class="callout" id="loginHint" hidden>
        <span class="callout__text">登录后才能写评价。</span>
        <span class="callout__actions"
          ><a class="btn btn--sm" href="login.html">登录</a
          ><a class="btn btn--primary btn--sm" href="register.html"
            >注册</a
          ></span
        >
      </div>

      <div id="recipeList" aria-live="polite"></div>
      <div class="load-more" id="loadMore" hidden>
        <button type="button" class="btn" id="moreBtn">加载更多</button
        ><span id="moreInfo"></span>
      </div>

      <dialog
        class="dialog dialog--sheet dialog--wide"
        id="reviewDialog"
        aria-labelledby="reviewDialog-t"
      >
        <form class="dialog__form" id="recipeForm" novalidate>
          <div class="dialog__head">
            <h2 class="dialog__title" id="reviewDialog-t">写评价</h2>
            <button
              type="button"
              class="icon-btn icon-btn--sm"
              data-dialog-close
              aria-label="关闭"
            >
              <svg class="icon" aria-hidden="true">
                <use href="/img/icons.svg#i-close"></use>
              </svg>
            </button>
          </div>
          <div class="dialog__body">
            <div class="field">
              <label class="field__label" for="name">菜名</label>
              <input
                class="input"
                id="name"
                type="text"
                required
                data-counter="20"
                enterkeyhint="next"
              />
              <div class="field__foot">
                <span class="field__hint">和食堂菜单写法一致更容易被搜到</span
                ><span class="field__counter"></span>
              </div>
            </div>
            <div class="field">
              <span class="field__label" id="ratingLabel">评分</span>
              <div
                class="rating-input"
                role="radiogroup"
                aria-labelledby="ratingLabel"
              >
                <input
                  type="radio"
                  name="rating"
                  id="r5"
                  value="5"
                  checked
                /><label for="r5" title="5 分"
                  ><svg class="icon" aria-hidden="true">
                    <use href="/img/icons.svg#i-star"></use></svg
                ></label>
                <input type="radio" name="rating" id="r4" value="4" /><label
                  for="r4"
                  title="4 分"
                  ><svg class="icon" aria-hidden="true">
                    <use href="/img/icons.svg#i-star"></use></svg
                ></label>
                <input type="radio" name="rating" id="r3" value="3" /><label
                  for="r3"
                  title="3 分"
                  ><svg class="icon" aria-hidden="true">
                    <use href="/img/icons.svg#i-star"></use></svg
                ></label>
                <input type="radio" name="rating" id="r2" value="2" /><label
                  for="r2"
                  title="2 分"
                  ><svg class="icon" aria-hidden="true">
                    <use href="/img/icons.svg#i-star"></use></svg
                ></label>
                <input type="radio" name="rating" id="r1" value="1" /><label
                  for="r1"
                  title="1 分"
                  ><svg class="icon" aria-hidden="true">
                    <use href="/img/icons.svg#i-star"></use></svg
                ></label>
              </div>
              <div class="field__hint">默认 5 分可改</div>
            </div>
            <div class="field">
              <label class="field__label" for="comment"
                >评论 <span class="field__opt">（选填）</span></label
              >
              <textarea
                class="textarea"
                id="comment"
                data-counter="500"
              ></textarea>
              <div class="field__foot">
                <span class="field__hint"></span
                ><span class="field__counter"></span>
              </div>
            </div>
            <div
              class="field"
              data-upload
              data-max-mb="2"
              data-types="image/jpeg,image/png"
            >
              <span class="field__label"
                >图片 <span class="field__opt">（选填）</span></span
              >
              <label class="upload"
                ><span class="upload__icon"
                  ><svg class="icon icon--lg" aria-hidden="true">
                    <use href="/img/icons.svg#i-image"></use></svg></span
                ><span class="upload__title">点击选择或拖入图片</span
                ><span class="upload__hint">JPG / PNG，不超过 2 MB</span
                ><input
                  aria-label="上传图片"
                  type="file"
                  id="image"
                  accept="image/jpeg,image/png"
              /></label>
              <div class="upload-preview-slot"></div>
            </div>
          </div>
          <div class="dialog__foot">
            <button type="button" class="btn" data-dialog-close>取消</button>
            <button type="submit" class="btn btn--primary" id="recipeSubmit">
              发布
            </button>
          </div>
        </form>
      </dialog>
    </main>
    <div id="siteFooter"></div>
    <script src="/js/ui.js"></script>
    <script src="/js/page.js"></script>

    <script src="/js/pages/recipe.js"></script>
  </body>
</html>
