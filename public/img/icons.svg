<!-- 拾光酥糕 图标库 v2.0 · 24x24 栅格 · 线性 1.75 · 圆角端点。样式由 .icon 提供（fill:none; stroke:currentColor）。
     注意：外部引用时根节点不能带 display:none（否则 <use> 不渲染）；内联进页面时请包一层 width=0 height=0 position:absolute 的 <svg>。 -->

<!-- 品牌字章：绿色底 + “拾”字（32x32），颜色取自 CSS 变量 seal 与 ink-inverse（自带回退值） -->
<symbol id="brand-mark" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" style="fill:var(--seal,#218653)"/>
  <text x="16" y="16" text-anchor="middle" dominant-baseline="central" style="fill:var(--ink-inverse,#FFFFFF);font-family:'Noto Sans CJK TC','Microsoft JhengHei','PingFang TC','Microsoft YaHei',sans-serif;font-size:20px;font-weight:700">拾</text>
</symbol>

<!-- 品牌字形（仅笔画，用于首页水印等装饰），颜色取自 CSS 变量 seal -->
<symbol id="brand-glyph" viewBox="0 0 32 32">
  <text x="16" y="16" text-anchor="middle" dominant-baseline="central" style="fill:var(--seal,#218653);font-family:'Noto Sans CJK TC','Microsoft JhengHei','PingFang TC','Microsoft YaHei',sans-serif;font-size:20px;font-weight:700">拾</text>
</symbol>

