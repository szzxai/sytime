<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · 校园信息网</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #000000;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #000000;
    padding: 16px 32px;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .nav {
    display: flex;
    gap: 24px;
  }
  .nav a {
    color: #000000;
    text-decoration: none;
    font-size: 16px;
    padding: 6px 4px;
    border-bottom: 2px solid transparent;
  }
  .nav a:hover { border-bottom: 2px solid #000000; }
  .auth {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn {
    display: inline-block;
    background: #ffffff;
    color: #000000;
    border: 2px solid #000000;
    border-radius: 0;
    padding: 8px 14px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    line-height: 1;
  }
  .btn:hover { background: #000000; color: #ffffff; }
  .layout {
    display: flex;
    align-items: stretch;
    min-height: calc(100vh - 63px);
  }
  .sidebar {
    flex: none;
    width: 220px;
    border-right: 2px solid #000000;
    padding: 20px 0;
  }
  .side-title {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    padding: 0 22px 14px;
    border-bottom: 2px solid #000000;
    margin-bottom: 12px;
  }
  .menu-item {
    display: block;
    width: 100%;
    background: none;
    border: none;
    text-align: left;
    padding: 12px 22px;
    font-size: 14px;
    font-family: inherit;
    color: #000000;
    cursor: pointer;
  }
  .menu-item:hover { background: #f2f2f2; }
  .menu-item.active { background: #000000; color: #ffffff; }
  .content {
    flex: 1;
    padding: 32px 40px 56px;
    max-width: 720px;
  }
  .view { display: none; }
  .view.active { display: block; }
  .view h1 {
    font-size: 18px;
    letter-spacing: 1px;
    margin: 0 0 22px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    color: #555555;
    margin-bottom: 6px;
  }
  .field input,
  .field textarea {
    width: 100%;
    border: 2px solid #000000;
    border-radius: 0;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: #000000;
    background: #ffffff;
    outline: none;
  }
  .field textarea { min-height: 180px; resize: vertical; }
  .submit {
    background: #000000;
    color: #ffffff;
    border: 2px solid #000000;
    border-radius: 0;
    padding: 10px 22px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  .submit:hover { background: #ffffff; color: #000000; }
  .submit:disabled { opacity: 0.5; cursor: default; }
  .msg { min-height: 18px; font-size: 13px; margin-top: 12px; }
  .msg.error { color: #cc0000; }
  .msg.ok { color: #008800; }
  .hint { font-size: 12px; color: #999999; margin: -6px 0 14px; }
  .app-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    border: 2px solid #000000;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .app-info { font-size: 14px; line-height: 1.8; }
  .app-meta { font-size: 12px; color: #777777; }
  .app-empty {
    font-size: 14px;
    color: #777777;
    text-align: center;
    padding: 24px;
    border: 2px dashed #dddddd;
  }
  .section-sub {
    font-size: 15px;
    letter-spacing: 1px;
    margin: 26px 0 14px;
  }
  .block {
    border: 2px solid #000000;
    padding: 22px;
    margin-bottom: 22px;
  }
  .block h2 {
    font-size: 15px;
    letter-spacing: 1px;
    margin: 0 0 18px;
  }
  .weekly-item {
    display: flex;
    align-items: center;
    gap: 16px;
    border: 2px solid #000000;
    padding: 12px 16px;
    margin-bottom: 12px;
  }
  .weekly-thumb {
    width: 96px;
    height: 96px;
    flex: none;
    object-fit: cover;
    border: 2px solid #000000;
    cursor: zoom-in;
    display: block;
    background: #f2f2f2;
  }
  .weekly-info { flex: 1; font-size: 14px; line-height: 1.8; }
  .weekly-dates { font-weight: bold; }
  .weekly-meta { font-size: 12px; color: #777777; }
  .lightbox {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 5000;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }
  .lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    border: 4px solid #ffffff;
    background: #ffffff;
  }
  input[type="date"] {
    position: relative;
    cursor: pointer;
  }
  input[type="date"]::-webkit-calendar-picker-indicator {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }
  .preview-modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 6000;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .preview-modal img {
    max-width: 90vw;
    max-height: 75vh;
    border: 4px solid #ffffff;
    background: #ffffff;
  }
  .preview-actions { display: flex; gap: 12px; }
  .weekly-preview { margin-top: 14px; }
  .weekly-preview-img {
    display: block;
    max-width: 100%;
    max-height: 320px;
    border: 2px solid #000000;
    background: #ffffff;
    margin-bottom: 12px;
  }
  .notice {
    border: 2px dashed #000000;
    padding: 24px;
    text-align: center;
    font-size: 14px;
  }
  .notice a { color: #000000; }
</style>
</head>
<body>
  <header class="header">
    <div class="logo">校园信息网</div>
    <div class="header-right">
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="map.html">校园地图</a>
        <a href="forum.html">论坛</a>
        <a href="recipe.html">菜谱评价</a>
      </nav>
      <div class="auth" id="authArea">
        <a class="btn" href="login.html">登录</a>
        <a class="btn" href="register.html">注册</a>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-title">管理后台</div>
      <div id="menuArea">
        <button type="button" class="menu-item active" data-panel="banner">编辑横幅</button>
        <button type="button" class="menu-item" data-panel="announce">更新公告</button>
        <button type="button" class="menu-item" data-panel="review">学生认证审核</button>
        <button type="button" class="menu-item" data-panel="invite">邀请码设置</button>
        <button type="button" class="menu-item" data-panel="weekly">每周菜谱管理</button>
      </div>
    </aside>

    <main class="content" id="contentArea">
      <section class="view active" id="view-banner">
        <h1>编辑横幅</h1>
        <div class="field">
          <label for="bannerInput">横幅文本</label>
          <input type="text" id="bannerInput" placeholder="留空则不显示横幅">
        </div>
        <button type="button" class="submit" id="bannerSubmit">确认修改</button>
        <button type="button" class="btn" id="bannerClear" style="margin-left:10px;">取消横幅</button>
        <div class="msg" id="bannerMsg"></div>
      </section>

      <section class="view" id="view-announce">
        <h1>更新公告</h1>
        <div class="field">
          <label for="annTitle">公告标题</label>
          <input type="text" id="annTitle">
        </div>
        <div class="field">
          <label for="annContent">公告内容</label>
          <textarea id="annContent"></textarea>
        </div>
        <button type="button" class="submit" id="annSubmit">发布公告</button>
        <div class="msg" id="annMsg"></div>
      </section>

      <section class="view" id="view-review">
        <h1>学生认证审核</h1>
        <div id="reviewList"></div>
      </section>

      <section class="view" id="view-invite">
        <h1>邀请码设置</h1>
        <div class="field">
          <label for="inviteCodeInput">新增邀请码</label>
          <input type="text" id="inviteCodeInput" placeholder="输入邀请码">
        </div>
        <div class="field">
          <label for="inviteMaxInput">可用次数（0 表示不限制）</label>
          <input type="number" id="inviteMaxInput" min="0" value="0">
        </div>
        <div class="hint">学生认证时填入有效邀请码可直接通过；次数用完后该邀请码失效。</div>
        <button type="button" class="submit" id="inviteAdd">添加</button>
        <div class="msg" id="inviteMsg"></div>
        <h2 class="section-sub">已有邀请码</h2>
        <div id="inviteList"></div>
      </section>

      <section class="view" id="view-weekly">
        <h1>每周菜谱管理</h1>
        <div class="block">
          <h2>上传菜谱图片</h2>
          <div class="field">
            <label for="weeklyStart">第一天</label>
            <input type="date" id="weeklyStart">
          </div>
          <div class="field">
            <label for="weeklyEnd">最后一天</label>
            <input type="date" id="weeklyEnd">
          </div>
          <button type="button" class="submit" id="weeklyChoose">选择图片并上传</button>
          <input type="file" id="weeklyFile" accept="image/jpeg,image/png" style="display:none;">
          <div class="weekly-preview" id="weeklyPreview" style="display:none;">
            <img class="weekly-preview-img" id="weeklyPreviewImg" alt="预览">
            <div class="preview-actions">
              <button type="button" class="submit" id="weeklyConfirm">确认上传</button>
              <button type="button" class="btn" id="weeklyCancel">取消</button>
            </div>
          </div>
          <div class="msg" id="weeklyMsg"></div>
        </div>
        <h2 class="section-sub">已上传菜谱</h2>
        <div id="weeklyList"></div>
      </section>
    </main>
  </div>

  <script src="auth.js"></script>
  <script>
    var token = localStorage.getItem("token");

    function authHeaders() {
      return { "Authorization": "Bearer " + token };
    }

    function handleStatus(status) {
      if (status === 401) {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        location.href = "login.html";
        return true;
      }
      return false;
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return "";
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    var menuItems = document.querySelectorAll("[data-panel]");
    for (var i = 0; i < menuItems.length; i++) {
      menuItems[i].addEventListener("click", function () {
        var name = this.getAttribute("data-panel");
        for (var j = 0; j < menuItems.length; j++) {
          menuItems[j].classList.toggle("active", menuItems[j] === this);
        }
        var views = document.querySelectorAll(".view");
        for (var k = 0; k < views.length; k++) {
          views[k].classList.toggle("active", views[k].id === "view-" + name);
        }
      });
    }

    document.getElementById("bannerSubmit").addEventListener("click", function () {
      var msg = document.getElementById("bannerMsg");
      var submit = document.getElementById("bannerSubmit");
      var value = document.getElementById("bannerInput").value;

      if (!confirm("确定要修改全站横幅吗？")) {
        return;
      }

      msg.className = "msg";
      msg.textContent = "提交中…";
      submit.disabled = true;
      fetch("/api/admin/settings/banner", {
        method: "PUT",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ value: value })
      })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (r) {
          if (!r.ok) {
            msg.className = "msg error";
            msg.textContent = r.status === 403 ? "无权限（需要 developer / super_admin）" : (r.data.error || "修改失败");
            submit.disabled = false;
            return;
          }
          msg.className = "msg ok";
          msg.textContent = "横幅已更新，刷新页面即可看到";
          submit.disabled = false;
        })
        .catch(function (err) {
          if (err.message !== "unauthorized") {
            msg.className = "msg error";
            msg.textContent = "网络错误：" + err.message;
            submit.disabled = false;
          }
        });
    });

    document.getElementById("bannerClear").addEventListener("click", function () {
      var msg = document.getElementById("bannerMsg");
      var submit = document.getElementById("bannerClear");
      if (!confirm("确定要取消全站横幅吗？取消后不再展示任何横幅。")) {
        return;
      }
      msg.className = "msg";
      msg.textContent = "提交中…";
      submit.disabled = true;
      fetch("/api/admin/settings/banner", {
        method: "PUT",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ value: "" })
      })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (r) {
          if (!r.ok) {
            msg.className = "msg error";
            msg.textContent = r.status === 403 ? "无权限（需要 developer / super_admin）" : (r.data.error || "取消失败");
            submit.disabled = false;
            return;
          }
          document.getElementById("bannerInput").value = "";
          msg.className = "msg ok";
          msg.textContent = "横幅已取消，全站不再显示横幅";
          submit.disabled = false;
        })
        .catch(function (err) {
          if (err.message !== "unauthorized") {
            msg.className = "msg error";
            msg.textContent = "网络错误：" + err.message;
            submit.disabled = false;
          }
        });
    });

    document.getElementById("annSubmit").addEventListener("click", function () {
      var msg = document.getElementById("annMsg");
      var submit = document.getElementById("annSubmit");
      var title = document.getElementById("annTitle").value.trim();
      var content = document.getElementById("annContent").value.trim();

      if (!title || !content) {
        msg.className = "msg error";
        msg.textContent = "标题和内容不能为空";
        return;
      }

      msg.className = "msg";
      msg.textContent = "发布中…";
      submit.disabled = true;
      fetch("/api/admin/announcements", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ title: title, content: content })
      })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (r) {
          if (!r.ok) {
            msg.className = "msg error";
            msg.textContent = r.status === 403 ? "无权限（需要 developer / super_admin）" : (r.data.error || "发布失败");
            submit.disabled = false;
            return;
          }
          document.getElementById("annTitle").value = "";
          document.getElementById("annContent").value = "";
          msg.className = "msg ok";
          msg.textContent = "公告已发布";
          submit.disabled = false;
        })
        .catch(function (err) {
          if (err.message !== "unauthorized") {
            msg.className = "msg error";
            msg.textContent = "网络错误：" + err.message;
            submit.disabled = false;
          }
        });
    });

    function loadReview() {
      var box = document.getElementById("reviewList");
      box.innerHTML = '<div class="app-empty">加载中…</div>';
      fetch("/api/admin/student-applications", { headers: authHeaders() })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          if (res.status === 403) throw new Error("forbidden");
          return res.json();
        })
        .then(function (data) {
          var list = data.applications || [];
          if (!list.length) {
            box.innerHTML = '<div class="app-empty">暂无待审核申请</div>';
            return;
          }
          box.innerHTML = list.map(function (a) {
            return '<div class="app-item" data-id="' + a.id + '">' +
              '<div class="app-info">' +
                '新生号：' + escapeHtml(a.student_id) + '<br>' +
                '班级：' + escapeHtml(a.class_name) + '<br>' +
                '真实姓名：' + escapeHtml(a.real_name) + '<br>' +
                (a.extra_info ? '补充信息：' + escapeHtml(a.extra_info) + '<br>' : '') +
                '<span class="app-meta">提交人：' + escapeHtml(a.username || ("用户#" + a.user_id)) + '</span>' +
              '</div>' +
              '<button type="button" class="submit" data-approve="' + a.id + '">通过</button>' +
            '</div>';
          }).join("");
        })
        .catch(function (err) {
          box.innerHTML = '<div class="app-empty">加载失败：' +
            escapeHtml(err.message === "forbidden" ? "无权限" : err.message) + '</div>';
        });
    }

    document.getElementById("reviewList").addEventListener("click", function (e) {
      var btn = e.target.closest ? e.target.closest("[data-approve]") : null;
      if (!btn) return;
      var id = btn.getAttribute("data-approve");
      btn.disabled = true;
      fetch("/api/admin/student-applications/approve", {
        method: "PUT",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ id: Number(id) })
      })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (r) {
          if (!r.ok) {
            btn.disabled = false;
            alert(r.status === 403 ? "无权限（需要 developer / super_admin）" : (r.data.error || "操作失败"));
            return;
          }
          var item = document.querySelector('.app-item[data-id="' + id + '"]');
          if (item) item.parentNode.removeChild(item);
          if (!document.querySelector(".app-item")) {
            document.getElementById("reviewList").innerHTML = '<div class="app-empty">暂无待审核申请</div>';
          }
        })
        .catch(function (err) {
          btn.disabled = false;
          if (err.message !== "unauthorized") alert("网络错误：" + err.message);
        });
    });

    function loadInvites() {
      var box = document.getElementById("inviteList");
      box.innerHTML = '<div class="app-empty">加载中…</div>';
      fetch("/api/admin/invite-codes", { headers: authHeaders() })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          if (res.status === 403) throw new Error("forbidden");
          return res.json();
        })
        .then(function (data) {
          var list = data.invite_codes || [];
          if (!list.length) {
            box.innerHTML = '<div class="app-empty">暂无邀请码</div>';
            return;
          }
          box.innerHTML = list.map(function (c) {
            var limit = c.max_uses > 0
              ? ("已用 " + c.used_count + " / " + c.max_uses)
              : ("已用 " + c.used_count + " / 不限");
            return '<div class="app-item" data-code-id="' + c.id + '">' +
              '<div class="app-info"><b>' + escapeHtml(c.code) + '</b><br>' +
                '<span class="app-meta">' + limit + '</span>' +
              '</div>' +
              '<button type="button" class="btn" data-delete-code="' + c.id + '">删除</button>' +
            '</div>';
          }).join("");
        })
        .catch(function (err) {
          box.innerHTML = '<div class="app-empty">加载失败：' +
            escapeHtml(err.message === "forbidden" ? "无权限" : err.message) + '</div>';
        });
    }

    document.getElementById("inviteAdd").addEventListener("click", function () {
      var msg = document.getElementById("inviteMsg");
      var submit = document.getElementById("inviteAdd");
      var code = document.getElementById("inviteCodeInput").value.trim();
      var maxUses = parseInt(document.getElementById("inviteMaxInput").value, 10);
      if (isNaN(maxUses) || maxUses < 0) maxUses = 0;
      if (!code) {
        msg.className = "msg error";
        msg.textContent = "请输入邀请码";
        return;
      }
      msg.className = "msg";
      msg.textContent = "添加中…";
      submit.disabled = true;
      fetch("/api/admin/invite-codes", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ code: code, max_uses: maxUses })
      })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (r) {
          if (!r.ok) {
            msg.className = "msg error";
            msg.textContent = r.status === 409 ? "该邀请码已存在" : (r.status === 403 ? "无权限（需要 developer / super_admin）" : (r.data.error || "添加失败"));
            submit.disabled = false;
            return;
          }
          document.getElementById("inviteCodeInput").value = "";
          document.getElementById("inviteMaxInput").value = "0";
          msg.className = "msg ok";
          msg.textContent = "邀请码已添加";
          submit.disabled = false;
          loadInvites();
        })
        .catch(function (err) {
          if (err.message !== "unauthorized") {
            msg.className = "msg error";
            msg.textContent = "网络错误：" + err.message;
            submit.disabled = false;
          }
        });
    });

    document.getElementById("inviteList").addEventListener("click", function (e) {
      var btn = e.target.closest ? e.target.closest("[data-delete-code]") : null;
      if (!btn) return;
      var id = btn.getAttribute("data-delete-code");
      if (!confirm("确定删除该邀请码吗？")) return;
      btn.disabled = true;
      fetch("/api/admin/invite-codes/" + id, {
        method: "DELETE",
        headers: authHeaders()
      })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (r) {
          if (!r.ok) { btn.disabled = false; alert(r.data.error || "删除失败"); return; }
          loadInvites();
        })
        .catch(function (err) {
          btn.disabled = false;
          if (err.message !== "unauthorized") alert("网络错误：" + err.message);
        });
    });

    fetch("/api/settings/banner")
      .then(function (res) { return res.json(); })
      .then(function (data) {
        document.getElementById("bannerInput").value = data.banner || "";
      })
      .catch(function () {});

    function formatTime(sec) {
      var d = new Date(Number(sec) * 1000);
      function p(n) { return n < 10 ? "0" + n : "" + n; }
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
    }

    function weeklyDateRange(item) {
      if (item.menu_start_date === item.menu_end_date) return item.menu_start_date;
      return item.menu_start_date + " ~ " + item.menu_end_date;
    }

    function openLightbox(url) {
      var box = document.createElement("div");
      box.className = "lightbox";
      var img = document.createElement("img");
      img.src = url;
      box.appendChild(img);
      box.addEventListener("click", function () {
        if (box.parentNode) box.parentNode.removeChild(box);
      });
      document.body.appendChild(box);
    }

    function loadWeekly() {
      var box = document.getElementById("weeklyList");
      box.innerHTML = '<div class="app-empty">加载中…</div>';
      fetch("/api/weekly-menu")
        .then(function (res) { return res.json(); })
        .then(function (data) {
          var list = data.images || [];
          if (!list.length) {
            box.innerHTML = '<div class="app-empty">暂无菜谱图片</div>';
            return;
          }
          box.innerHTML = list.map(function (it) {
            return '<div class="weekly-item" data-id="' + it.id + '">' +
              '<img class="weekly-thumb" src="' + escapeHtml(it.url) + '" alt="菜谱图片" data-zoom="' + escapeHtml(it.url) + '">' +
              '<div class="weekly-info">' +
                '<div class="weekly-dates">' + escapeHtml(weeklyDateRange(it)) + '</div>' +
                '<div class="weekly-meta">上传者：' + escapeHtml(it.username || "未知") + ' · 上传于 ' + formatTime(it.uploaded_at) + '</div>' +
              '</div>' +
              '<button type="button" class="btn" data-delete-weekly="' + it.id + '">删除</button>' +
            '</div>';
          }).join("");
        })
        .catch(function (err) {
          box.innerHTML = '<div class="app-empty">加载失败：' + escapeHtml(err.message) + '</div>';
        });
    }

    document.getElementById("weeklyChoose").addEventListener("click", function () {
      document.getElementById("weeklyFile").click();
    });

    var weeklyPendingFile = null;

    function closeWeeklyPreview() {
      weeklyPendingFile = null;
      document.getElementById("weeklyPreview").style.display = "none";
      document.getElementById("weeklyPreviewImg").src = "";
    }

    function uploadWeeklyFile(file) {
      var msg = document.getElementById("weeklyMsg");
      var start = document.getElementById("weeklyStart").value;
      var end = document.getElementById("weeklyEnd").value;
      var fd = new FormData();
      fd.append("menu_start_date", start);
      fd.append("menu_end_date", end);
      fd.append("image", file);
      msg.className = "msg";
      msg.textContent = "上传中…";
      fetch("/api/admin/weekly-menu/upload", { method: "POST", headers: authHeaders(), body: fd })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
        })
        .then(function (r) {
          if (!r.ok) {
            msg.className = "msg error";
            msg.textContent = r.status === 403 ? "无权限（需要 admin 及以上）" : (r.data.error || "上传失败");
            return;
          }
          msg.className = "msg ok";
          msg.textContent = "上传成功";
          loadWeekly();
        })
        .catch(function (err) {
          if (err.message !== "unauthorized") {
            msg.className = "msg error";
            msg.textContent = "网络错误：" + err.message;
          }
        });
    }

    function openWeeklyPreview(file) {
      var msg = document.getElementById("weeklyMsg");
      var start = document.getElementById("weeklyStart").value;
      var end = document.getElementById("weeklyEnd").value;
      if (!start || !end) {
        msg.className = "msg error";
        msg.textContent = "请先选择第一天和最后一天";
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        msg.className = "msg error";
        msg.textContent = "图片不能超过 5MB";
        return;
      }
      weeklyPendingFile = file;
      document.getElementById("weeklyPreviewImg").src = URL.createObjectURL(file);
      document.getElementById("weeklyPreview").style.display = "block";
      msg.className = "msg";
      msg.textContent = "";
    }

    document.getElementById("weeklyConfirm").addEventListener("click", function () {
      var f = weeklyPendingFile;
      closeWeeklyPreview();
      if (f) uploadWeeklyFile(f);
    });

    document.getElementById("weeklyCancel").addEventListener("click", closeWeeklyPreview);

    document.getElementById("weeklyFile").addEventListener("change", function () {
      var fileInput = document.getElementById("weeklyFile");
      var file = fileInput.files && fileInput.files[0];
      fileInput.value = "";
      if (!file) return;
      openWeeklyPreview(file);
    });

    document.getElementById("weeklyList").addEventListener("click", function (e) {
      var zoom = e.target.closest ? e.target.closest("[data-zoom]") : null;
      if (zoom) {
        openLightbox(zoom.getAttribute("data-zoom"));
        return;
      }
      var del = e.target.closest ? e.target.closest("[data-delete-weekly]") : null;
      if (!del) return;
      var id = del.getAttribute("data-delete-weekly");
      if (!confirm("确定要删除该菜谱图片吗？")) return;
      del.disabled = true;
      fetch("/api/admin/weekly-menu/" + id, { method: "DELETE", headers: authHeaders() })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (r) {
          if (!r.ok) { del.disabled = false; alert(r.data.error || "删除失败"); return; }
          loadWeekly();
        })
        .catch(function (err) {
          del.disabled = false;
          if (err.message !== "unauthorized") alert("网络错误：" + err.message);
        });
    });

    var dateInputs = document.querySelectorAll('input[type="date"]');
    for (var di = 0; di < dateInputs.length; di++) {
      dateInputs[di].addEventListener("click", function () {
        if (this.showPicker) {
          try { this.showPicker(); } catch (e) {}
        }
      });
    }

    function denyAccess(text) {
      document.getElementById("menuArea").style.display = "none";
      document.getElementById("contentArea").innerHTML =
        '<div class="notice">' + text + '　<a href="index.html">返回首页</a></div>';
    }

    if (!token) {
      location.href = "login.html";
    } else {
      fetch("/api/user/profile", { headers: authHeaders() })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json();
        })
        .then(function (data) {
          var role = data.user && data.user.role;
          if (role !== "developer" && role !== "super_admin") {
            denyAccess("暂无权限访问管理后台");
          } else {
            loadReview();
            loadInvites();
            loadWeekly();
          }
        })
        .catch(function () {});
    }
  </script>
</body>
</html>
