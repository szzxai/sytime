<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · 校园信息网</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #000000;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #000000;
    padding: 16px 32px;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .nav {
    display: flex;
    gap: 24px;
  }
  .nav a {
    color: #000000;
    text-decoration: none;
    font-size: 16px;
    padding: 6px 4px;
    border-bottom: 2px solid transparent;
  }
  .nav a:hover { border-bottom: 2px solid #000000; }
  .auth {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn {
    display: inline-block;
    background: #ffffff;
    color: #000000;
    border: 2px solid #000000;
    border-radius: 0;
    padding: 8px 14px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    line-height: 1;
  }
  .btn:hover { background: #000000; color: #ffffff; }
  .layout {
    display: flex;
    align-items: stretch;
    min-height: calc(100vh - 63px);
  }
  .sidebar {
    flex: none;
    width: 220px;
    border-right: 2px solid #000000;
    padding: 20px 0;
  }
  .side-title {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    padding: 0 22px 14px;
    border-bottom: 2px solid #000000;
    margin-bottom: 12px;
  }
  .menu-item {
    display: block;
    width: 100%;
    background: none;
    border: none;
    text-align: left;
    padding: 12px 22px;
    font-size: 14px;
    font-family: inherit;
    color: #000000;
    cursor: pointer;
  }
  .menu-item:hover { background: #f2f2f2; }
  .menu-item.active { background: #000000; color: #ffffff; }
  .content {
    flex: 1;
    padding: 32px 40px 56px;
    max-width: 720px;
  }
  .view { display: none; }
  .view.active { display: block; }
  .view h1 {
    font-size: 18px;
    letter-spacing: 1px;
    margin: 0 0 22px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    color: #555555;
    margin-bottom: 6px;
  }
  .field input,
  .field textarea {
    width: 100%;
    border: 2px solid #000000;
    border-radius: 0;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: #000000;
    background: #ffffff;
    outline: none;
  }
  .field textarea { min-height: 180px; resize: vertical; }
  .submit {
    background: #000000;
    color: #ffffff;
    border: 2px solid #000000;
    border-radius: 0;
    padding: 10px 22px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  .submit:hover { background: #ffffff; color: #000000; }
  .submit:disabled { opacity: 0.5; cursor: default; }
  .msg { min-height: 18px; font-size: 13px; margin-top: 12px; }
  .msg.error { color: #cc0000; }
  .msg.ok { color: #008800; }
  .hint { font-size: 12px; color: #999999; margin: -6px 0 14px; }
  .app-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    border: 2px solid #000000;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .app-info { font-size: 14px; line-height: 1.8; }
  .app-meta { font-size: 12px; color: #777777; }
  .app-actions { display: flex; gap: 8px; flex: none; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .perms-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
  .perms-row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .perms-row input { width: auto; }
  .app-empty {
    font-size: 14px;
    color: #777777;
    text-align: center;
    padding: 24px;
    border: 2px dashed #dddddd;
  }
  .section-sub {
    font-size: 15px;
    letter-spacing: 1px;
    margin: 26px 0 14px;
  }
  .block {
    border: 2px solid #000000;
    padding: 22px;
    margin-bottom: 22px;
  }
  .block h2 {
    font-size: 15px;
    letter-spacing: 1px;
    margin: 0 0 18px;
  }
  .weekly-item {
    display: flex;
    align-items: center;
    gap: 16px;
    border: 2px solid #000000;
    padding: 12px 16px;
    margin-bottom: 12px;
  }
  .weekly-thumb {
    width: 96px;
    height: 96px;
    flex: none;
    object-fit: cover;
    border: 2px solid #000000;
    cursor: zoom-in;
    display: block;
    background: #f2f2f2;
  }
  .weekly-info { flex: 1; font-size: 14px; line-height: 1.8; }
  .weekly-dates { font-weight: bold; }
  .weekly-meta { font-size: 12px; color: #777777; }
  .lightbox {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 5000;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }
  .lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    border: 4px solid #ffffff;
    background: #ffffff;
  }
  input[type="date"] {
    position: relative;
    cursor: pointer;
  }
  input[type="date"]::-webkit-calendar-picker-indicator {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
  }
  .preview-modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 6000;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .preview-modal img {
    max-width: 90vw;
    max-height: 75vh;
    border: 4px solid #ffffff;
    background: #ffffff;
  }
  .preview-actions { display: flex; gap: 12px; }
  .weekly-preview { margin-top: 14px; }
  .weekly-preview-img {
    display: block;
    max-width: 100%;
    max-height: 320px;
    border: 2px solid #000000;
    background: #ffffff;
    margin-bottom: 12px;
  }
  .notice {
    border: 2px dashed #000000;
    padding: 24px;
    text-align: center;
    font-size: 14px;
  }
  .notice a { color: #000000; }
  .user-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .user-table th,
  .user-table td {
    border: 1px solid #000000;
    padding: 8px 10px;
    text-align: left;
    vertical-align: middle;
  }
  .user-table th {
    background: #000000;
    color: #ffffff;
    font-weight: normal;
    letter-spacing: 1px;
  }
  .user-table select {
    border: 2px solid #000000;
    border-radius: 0;
    padding: 4px 6px;
    font-size: 13px;
    font-family: inherit;
    color: #000000;
    background: #ffffff;
    outline: none;
  }
  .tag-banned { color: #cc0000; }
  .appeal-thumb {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border: 2px solid #000000;
    cursor: zoom-in;
    display: block;
    margin-top: 8px;
    background: #f2f2f2;
  }
  .modal-mask {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 7000;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-box {
    width: 420px;
    max-width: 92vw;
    background: #ffffff;
    border: 2px solid #000000;
    padding: 24px;
  }
  .modal-box h2 {
    font-size: 16px;
    letter-spacing: 1px;
    margin: 0 0 18px;
  }
  .check-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
  }
  .check-row input { width: auto; }
</style>
</head>
<body>
  <header class="header">
    <div class="logo">校园信息网</div>
    <div class="header-right">
      <nav class="nav">
        <a href="map.html">校园地图</a>
        <a href="forum.html">论坛</a>
        <a href="recipe.html">菜谱评价</a>
        <a href="announcements.html">更新公告</a>
      </nav>
      <div class="auth" id="authArea">
        <a class="btn" href="login.html">登录</a>
        <a class="btn" href="register.html">注册</a>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-title">管理后台</div>
      <div id="menuArea">
        <button type="button" class="menu-item active" data-panel="banner">编辑横幅</button>
        <button type="button" class="menu-item" data-panel="announce">更新公告</button>
        <button type="button" class="menu-item" data-panel="review">学生认证审核</button>
        <button type="button" class="menu-item" data-panel="invite">邀请码设置</button>
        <button type="button" class="menu-item" data-panel="weekly">每周菜谱管理</button>
        <button type="button" class="menu-item" data-panel="users">用户管理</button>
        <button type="button" class="menu-item" data-panel="appeals">申诉处理</button>
      </div>
    </aside>

    <main class="content" id="contentArea">
      <section class="view active" id="view-banner">
        <h1>编辑横幅</h1>
        <div class="field">
          <label for="bannerInput">横幅文本</label>
          <input type="text" id="bannerInput" placeholder="留空则不显示横幅">
        </div>
        <button type="button" class="submit" id="bannerSubmit">确认修改</button>
        <button type="button" class="btn" id="bannerClear" style="margin-left:10px;">取消横幅</button>
        <div class="msg" id="bannerMsg"></div>
      </section>

      <section class="view" id="view-announce">
        <h1>更新公告</h1>
        <div class="field">
          <label for="annTitle">公告标题</label>
          <input type="text" id="annTitle">
        </div>
        <div class="field">
          <label for="annContent">公告内容</label>
          <textarea id="annContent"></textarea>
        </div>
        <button type="button" class="submit" id="annSubmit">发布公告</button>
        <div class="msg" id="annMsg"></div>
      </section>

      <section class="view" id="view-review">
        <h1>学生认证审核</h1>
        <div id="reviewList"></div>
      </section>

      <section class="view" id="view-invite">
        <h1>邀请码设置</h1>
        <div class="field">
          <label for="inviteCodeInput">新增邀请码</label>
          <input type="text" id="inviteCodeInput" placeholder="输入邀请码">
        </div>
        <div class="field">
          <label for="inviteMaxInput">可用次数（0 表示不限制）</label>
          <input type="number" id="inviteMaxInput" min="0" value="0">
        </div>
        <div class="hint">学生认证时填入有效邀请码可直接通过；次数用完后该邀请码失效。</div>
        <button type="button" class="submit" id="inviteAdd">添加</button>
        <div class="msg" id="inviteMsg"></div>
        <h2 class="section-sub">已有邀请码</h2>
        <div id="inviteList"></div>
      </section>

      <section class="view" id="view-weekly">
        <h1>每周菜谱管理</h1>
        <div class="block">
          <h2>上传菜谱图片</h2>
          <div class="field">
            <label for="weeklyStart">第一天</label>
            <input type="date" id="weeklyStart">
          </div>
          <div class="field">
            <label for="weeklyEnd">最后一天</label>
            <input type="date" id="weeklyEnd">
          </div>
          <button type="button" class="submit" id="weeklyChoose">选择图片并上传</button>
          <input type="file" id="weeklyFile" accept="image/jpeg,image/png" style="display:none;">
          <div class="weekly-preview" id="weeklyPreview" style="display:none;">
            <img class="weekly-preview-img" id="weeklyPreviewImg" alt="预览">
            <div class="preview-actions">
              <button type="button" class="submit" id="weeklyConfirm">确认上传</button>
              <button type="button" class="btn" id="weeklyCancel">取消</button>
            </div>
          </div>
          <div class="msg" id="weeklyMsg"></div>
        </div>
        <h2 class="section-sub">已上传菜谱</h2>
        <div id="weeklyList"></div>
      </section>

      <section class="view" id="view-users">
        <h1>用户管理</h1>
        <div id="userList"></div>
      </section>

      <section class="view" id="view-appeals">
        <h1>申诉处理</h1>
        <div id="appealList"></div>
      </section>
    </main>
  </div>

  <div class="modal-mask" id="banModal" style="display:none;">
    <div class="modal-box">
      <h2>封禁用户 <span id="banTargetName"></span></h2>
      <div class="field">
        <label for="banReasonInput">封禁理由（选填）</label>
        <input type="text" id="banReasonInput">
      </div>
      <div class="field">
        <label>上传图片（选填）</label>
        <button type="button" class="btn" id="banImageChoose">选择图片</button>
        <input type="file" id="banImageInput" accept="image/jpeg,image/png" style="display:none;">
        <span class="hint" id="banImageName" style="margin:0 0 0 10px;"></span>
      </div>
      <div class="field">
        <label class="check-row"><input type="checkbox" id="banAllowAppeal" checked> 允许申请解封</label>
      </div>
      <div class="msg" id="banMsg"></div>
      <div class="preview-actions">
        <button type="button" class="submit" id="banConfirm">确认封禁</button>
        <button type="button" class="btn" id="banCancel">取消</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="rejectModal" style="display:none;">
    <div class="modal-box">
      <h2>拒绝学生认证</h2>
      <div class="field">
        <label for="rejectReasonInput">拒绝原因（选填）</label>
        <input type="text" id="rejectReasonInput">
      </div>
      <div class="msg" id="rejectMsg"></div>
      <div class="preview-actions">
        <button type="button" class="submit" id="rejectConfirm">确认拒绝</button>
        <button type="button" class="btn" id="rejectCancel">取消</button>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="permsModal" style="display:none;">
    <div class="modal-box">
      <h2>设置权限 <span id="permsTargetName"></span></h2>
      <div id="permsList" class="perms-list"></div>
      <div class="msg" id="permsMsg"></div>
      <div class="preview-actions">
        <button type="button" class="submit" id="permsConfirm">保存</button>
        <button type="button" class="btn" id="permsCancel">取消</button>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    var token = localStorage.getItem("token");

    function authHeaders() {
      return { "Authorization": "Bearer " + token };
    }

    function handleStatus(status) {
      if (status === 401) {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        location.href = "login.html";
        return true;
      }
      return false;
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return "";
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    var menuItems = document.querySelectorAll("[data-panel]");
    for (var i = 0; i < menuItems.length; i++) {
      menuItems[i].addEventListener("click", function () {
        var name = this.getAttribute("data-panel");
        for (var j = 0; j < menuItems.length; j++) {
          menuItems[j].classList.toggle("active", menuItems[j] === this);
        }
        var views = document.querySelectorAll(".view");
        for (var k = 0; k < views.length; k++) {
          views[k].classList.toggle("active", views[k].id === "view-" + name);
        }
      });
    }

    document.getElementById("bannerSubmit").addEventListener("click", function () {
      var msg = document.getElementById("bannerMsg");
      var submit = document.getElementById("bannerSubmit");
      var value = document.getElementById("bannerInput").value;

      if (!confirm("确定要修改全站横幅吗？")) {
        return;
      }

      msg.className = "msg";
      msg.textContent = "提交中…";
      submit.disabled = true;
      fetch("/api/admin/settings/banner", {
        method: "PUT",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ value: value })
      })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (r) {
          if (!r.ok) {
            msg.className = "msg error";
            msg.textContent = r.status === 403 ? "无权限（需要 developer / super_admin）" : (r.data.error || "修改失败");
            submit.disabled = false;
            return;
          }
          msg.className = "msg ok";
          msg.textContent = "横幅已更新，刷新页面即可看到";
          submit.disabled = false;
        })
        .catch(function (err) {
          if (err.message !== "unauthorized") {
            msg.className = "msg error";
            msg.textContent = "网络错误：" + err.message;
            submit.disabled = false;
          }
        });
    });

    document.getElementById("bannerClear").addEventListener("click", function () {
      var msg = document.getElementById("bannerMsg");
      var submit = document.getElementById("bannerClear");
      if (!confirm("确定要取消全站横幅吗？取消后不再展示任何横幅。")) {
        return;
      }
      msg.className = "msg";
      msg.textContent = "提交中…";
      submit.disabled = true;
      fetch("/api/admin/settings/banner", {
        method: "PUT",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ value: "" })
      })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (r) {
          if (!r.ok) {
            msg.className = "msg error";
            msg.textContent = r.status === 403 ? "无权限（需要 developer / super_admin）" : (r.data.error || "取消失败");
            submit.disabled = false;
            return;
          }
          document.getElementById("bannerInput").value = "";
          msg.className = "msg ok";
          msg.textContent = "横幅已取消，全站不再显示横幅";
          submit.disabled = false;
        })
        .catch(function (err) {
          if (err.message !== "unauthorized") {
            msg.className = "msg error";
            msg.textContent = "网络错误：" + err.message;
            submit.disabled = false;
          }
        });
    });

    document.getElementById("annSubmit").addEventListener("click", function () {
      var msg = document.getElementById("annMsg");
      var submit = document.getElementById("annSubmit");
      var title = document.getElementById("annTitle").value.trim();
      var content = document.getElementById("annContent").value.trim();

      if (!title || !content) {
        msg.className = "msg error";
        msg.textContent = "标题和内容不能为空";
        return;
      }

      msg.className = "msg";
      msg.textContent = "发布中…";
      submit.disabled = true;
      fetch("/api/admin/announcements", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ title: title, content: content })
      })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (r) {
          if (!r.ok) {
            msg.className = "msg error";
            msg.textContent = r.status === 403 ? "无权限（需要 developer / super_admin）" : (r.data.error || "发布失败");
            submit.disabled = false;
            return;
          }
          document.getElementById("annTitle").value = "";
          document.getElementById("annContent").value = "";
          msg.className = "msg ok";
          msg.textContent = "公告已发布";
          submit.disabled = false;
        })
        .catch(function (err) {
          if (err.message !== "unauthorized") {
            msg.className = "msg error";
            msg.textContent = "网络错误：" + err.message;
            submit.disabled = false;
          }
        });
    });

    function loadReview() {
      var box = document.getElementById("reviewList");
      box.innerHTML = '<div class="app-empty">加载中…</div>';
      fetch("/api/admin/student-applications", { headers: authHeaders() })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          if (res.status === 403) throw new Error("forbidden");
          return res.json();
        })
        .then(function (data) {
          var list = data.applications || [];
          if (!list.length) {
            box.innerHTML = '<div class="app-empty">暂无待审核申请</div>';
            return;
          }
          box.innerHTML = list.map(function (a) {
            return '<div class="app-item" data-id="' + a.id + '">' +
              '<div class="app-info">' +
                '新生号：' + escapeHtml(a.student_id) + '<br>' +
                '班级：' + escapeHtml(a.class_name) + '<br>' +
                '真实姓名：' + escapeHtml(a.real_name) + '<br>' +
                (a.extra_info ? '补充信息：' + escapeHtml(a.extra_info) + '<br>' : '') +
                '<span class="app-meta">提交人：' + escapeHtml(a.username || ("用户#" + a.user_id)) + '</span>' +
              '</div>' +
              '<div class="app-actions">' +

    var ROLE_WEIGHTS = { developer: 6, super_admin: 5, admin: 4, student: 3, user: 2, guest: 1 };
    var ASSIGNABLE_ROLES = ["user", "student", "admin", "super_admin", "developer"];
    var currentUserId = null;
    var currentWeight = 0;
    var currentPermissions = [];
    var permissionCatalog = [];
    var usersById = {};

    var PANEL_PERMS = {
      banner: { perm: "banner_edit", role: "super_admin" },
      announce: { perm: "announcement_publish", role: "super_admin" },
      review: { perm: "student_review", role: "super_admin" },
      invite: { perm: "invite_manage", role: "super_admin" },
      weekly: { perm: "weekly_menu_upload", role: "admin" },
      users: { perm: "user_manage", role: "super_admin" },
      appeals: { perm: "ban_appeal_review", role: "super_admin" }
    };

    function canAccessPanel(name) {
      var req = PANEL_PERMS[name];
      if (!req) return true;
      if (currentWeight >= (ROLE_WEIGHTS[req.role] || 0)) return true;
      return currentPermissions.indexOf(req.perm) !== -1;
    }

    function applyPermissions() {
      var items = document.querySelectorAll("[data-panel]");
      var firstAllowed = null;
      for (var i = 0; i < items.length; i++) {
        var name = items[i].getAttribute("data-panel");
        var ok = canAccessPanel(name);
        items[i].style.display = ok ? "" : "none";
        if (ok && !firstAllowed) firstAllowed = name;
      }
      if (firstAllowed) {
        for (var j = 0; j < items.length; j++) {
          items[j].classList.toggle("active", items[j].getAttribute("data-panel") === firstAllowed);
        }
        var views = document.querySelectorAll(".view");
        for (var k = 0; k < views.length; k++) {
          views[k].classList.toggle("active", views[k].id === "view-" + firstAllowed);
        }
      }
      if (canAccessPanel("review")) loadReview();
      if (canAccessPanel("invite")) loadInvites();
      if (canAccessPanel("weekly")) loadWeekly();
      if (canAccessPanel("users")) { loadPermissionCatalog(); loadUsers(); }
      if (canAccessPanel("appeals")) loadAppeals();
    }

    function loadPermissionCatalog() {
      fetch("/api/admin/permissions", { headers: authHeaders() })
        .then(function (res) { return res.json(); })
        .then(function (data) { permissionCatalog = data.permissions || []; })
        .catch(function () {});

    function loadUsers() {
      var box = document.getElementById("userList");
      box.innerHTML = '<div class="app-empty">加载中…</div>';
      fetch("/api/admin/users", { headers: authHeaders() })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          if (res.status === 403) throw new Error("forbidden");
          return res.json();
        })
        .then(function (data) {
          var list = data.users || [];
          var selfW = currentWeight;
          var rows = list.map(function (u) {
            usersById[u.id] = u;
            var targetWeight = ROLE_WEIGHTS[u.role] || 0;
            var editable = u.id !== currentUserId && targetWeight < selfW;
            var roleCell;
            if (editable) {
              var opts = "";
              for (var i = 0; i < ASSIGNABLE_ROLES.length; i++) {
                var r = ASSIGNABLE_ROLES[i];
                var rw = ROLE_WEIGHTS[r];
                if (rw >= ROLE_WEIGHTS.user && rw <= selfW - 1) {
                  opts += '<option value="' + r + '"' + (r === u.role ? " selected" : "") + '>' + r + '</option>';
                }
              }
              roleCell = '<select data-role-select="' + u.id + '">' + opts + '</select>';
            } else {
              roleCell = escapeHtml(u.role);
            }
            var statusCell = u.status === "banned" ? '<span class="tag-banned">已封禁</span>' : "正常";
            var actionCell = "—";
            if (editable) {
              var banBtn = u.status === "banned"
                ? '<button type="button" class="btn" data-unban="' + u.id + '">解封</button>'
                : '<button type="button" class="btn" data-ban="' + u.id + '" data-name="' + escapeHtml(u.username) + '">封号</button>';
              actionCell = '<span class="row-actions">' +
                '<button type="button" class="btn" data-perms="' + u.id + '">权限</button>' +
                banBtn +
              '</span>';
            }
            return '<tr><td>' + escapeHtml(u.display_id || String(u.id)) + '</td>' +
              '<td>' + escapeHtml(u.username) + '</td>' +
              '<td>' + escapeHtml(u.nickname || "") + '</td>' +
              '<td>' + roleCell + '</td>' +
              '<td>' + statusCell + '</td>' +
              '<td>' + actionCell + '</td></tr>';
          }).join("");
          box.innerHTML = '<table class="user-table"><thead><tr>' +
            '<th>ID</th><th>用户名</th><th>昵称</th><th>角色</th><th>状态</th><th>操作</th>' +
            '</tr></thead><tbody>' + rows + '</tbody></table>';
        })
        .catch(function (err) {
          box.innerHTML = '<div class="app-empty">加载失败：' +
            escapeHtml(err.message === "forbidden" ? "无权限" : err.message) + '</div>';
        });
    }

        return;
      }
      var ban = e.target.closest ? e.target.closest("[data-ban]") : null;
      if (ban) {
        openBanModal(Number(ban.getAttribute("data-ban")), ban.getAttribute("data-name"));
        return;
      }
      var unb = e.target.closest ? e.target.closest("[data-unban]") : null;
      if (!unb) return;
      if (!confirm("确定要解封该用户吗？")) return;
      unb.disabled = true;
      fetch("/api/admin/users/unban", {
        method: "PUT",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ userId: Number(unb.getAttribute("data-unban")) })
      })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
        })
        .then(function (r) {
          unb.disabled = false;
          if (!r.ok) { alert(r.status === 403 ? "无权解封该用户" : (r.data.error || "解封失败")); return; }
          loadUsers();
        })
        .catch(function (err) {
          unb.disabled = false;
          if (err.message !== "unauthorized") alert("网络错误：" + err.message);
        });
    });

    var banPendingUserId = null;

    function openBanModal(id, name) {
      banPendingUserId = id;
      document.getElementById("banTargetName").textContent = name || ("用户#" + id);
      document.getElementById("banReasonInput").value = "";
      document.getElementById("banAllowAppeal").checked = true;
      document.getElementById("banImageInput").value = "";
      document.getElementById("banImageName").textContent = "";
      var m = document.getElementById("banMsg");
      m.className = "msg";
      m.textContent = "";
      document.getElementById("banModal").style.display = "flex";
    }

    function closeBanModal() {
      banPendingUserId = null;
      document.getElementById("banModal").style.display = "none";
    }

    document.getElementById("banImageChoose").addEventListener("click", function () {
      document.getElementById("banImageInput").click();
    });

    document.getElementById("banImageInput").addEventListener("change", function () {
      var f = this.files && this.files[0];
      document.getElementById("banImageName").textContent = f ? f.name : "";
    });

    document.getElementById("banCancel").addEventListener("click", closeBanModal);

    document.getElementById("banConfirm").addEventListener("click", function () {
      if (banPendingUserId === null) return;
      var msg = document.getElementById("banMsg");
      var btn = document.getElementById("banConfirm");
      var file = document.getElementById("banImageInput").files && document.getElementById("banImageInput").files[0];
      var fd = new FormData();
      fd.append("userId", String(banPendingUserId));
      fd.append("ban_reason", document.getElementById("banReasonInput").value);
      fd.append("allow_appeal", document.getElementById("banAllowAppeal").checked ? "1" : "0");
      if (file) fd.append("ban_image", file);
      msg.className = "msg";
      msg.textContent = "提交中…";
      btn.disabled = true;
      fetch("/api/admin/users/ban", { method: "PUT", headers: authHeaders(), body: fd })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
        })
        .then(function (r) {
          btn.disabled = false;
          if (!r.ok) {
            msg.className = "msg error";
            msg.textContent = r.status === 403 ? "无权封禁该用户" : (r.data.error || "封禁失败");
            return;
          }
          closeBanModal();
          loadUsers();
        })
        .catch(function (err) {
          btn.disabled = false;
          if (err.message !== "unauthorized") {
            msg.className = "msg error";
            msg.textContent = "网络错误：" + err.message;
          }
        });
    });

    function loadAppeals() {
      var box = document.getElementById("appealList");
      box.innerHTML = '<div class="app-empty">加载中…</div>';
      fetch("/api/admin/ban-appeals", { headers: authHeaders() })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          if (res.status === 403) throw new Error("forbidden");
          return res.json();
        })
        .then(function (data) {
          var list = data.appeals || [];
          if (!list.length) {
            box.innerHTML = '<div class="app-empty">暂无待处理申诉</div>';
            return;
          }
          box.innerHTML = list.map(function (a) {
            return '<div class="app-item" data-appeal-id="' + a.id + '">' +
              '<div class="app-info">' +
                '用户ID：' + escapeHtml(a.display_id || String(a.user_id)) +
                '（' + escapeHtml(a.username || "未知") + '）<br>' +
                '申诉理由：' + escapeHtml(a.appeal_reason) +
                (a.appeal_image ? '<img class="appeal-thumb" src="' + escapeHtml(a.appeal_image) + '" data-zoom="' + escapeHtml(a.appeal_image) + '" alt="申诉图片">' : '') +
              '</div>' +
              '<div class="preview-actions">' +
                '<button type="button" class="submit" data-approve-appeal="' + a.id + '">通过</button>' +
                '<button type="button" class="btn" data-reject-appeal="' + a.id + '">驳回</button>' +
              '</div>' +
            '</div>';
          }).join("");
        })
        .catch(function (err) {
          box.innerHTML = '<div class="app-empty">加载失败：' +
            escapeHtml(err.message === "forbidden" ? "无权限" : err.message) + '</div>';
        });
    }

    function reviewAppeal(id, action, btn) {
      var label = action === "approve" ? "通过" : "驳回";
      if (!confirm("确定要" + label + "该申诉吗？")) return;
      btn.disabled = true;
      fetch("/api/admin/ban-appeals/review", {
        method: "PUT",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ appealId: id, action: action })
      })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
        })
        .then(function (r) {
          if (!r.ok) { btn.disabled = false; alert(r.data.error || "操作失败"); return; }
          loadAppeals();
          loadUsers();
        })
        .catch(function (err) {
          btn.disabled = false;
          if (err.message !== "unauthorized") alert("网络错误：" + err.message);
        });
    }

    document.getElementById("appealList").addEventListener("click", function (e) {
      var zoom = e.target.closest ? e.target.closest("[data-zoom]") : null;
      if (zoom) {
        openLightbox(zoom.getAttribute("data-zoom"));
        return;
      }
      var ap = e.target.closest ? e.target.closest("[data-approve-appeal]") : null;
      if (ap) {
        reviewAppeal(Number(ap.getAttribute("data-approve-appeal")), "approve", ap);
        return;
      }
      var rj = e.target.closest ? e.target.closest("[data-reject-appeal]") : null;
      if (rj) reviewAppeal(Number(rj.getAttribute("data-reject-appeal")), "reject", rj);
    });

    function denyAccess(text) {
      document.getElementById("menuArea").style.display = "none";
      document.getElementById("contentArea").innerHTML =
        '<div class="notice">' + text + '　<a href="index.html">返回首页</a></div>';
    }

    if (!token) {
      location.href = "login.html";
    } else {
      fetch("/api/user/profile", { headers: authHeaders() })
        .then(function (res) {
          if (handleStatus(res.status)) throw new Error("unauthorized");
          return res.json();
        })
        .then(function (data) {
          var user = data.user || {};
          currentUserId = user.id;
          currentWeight = ROLE_WEIGHTS[user.role] || 0;
          currentPermissions = user.permissions || [];
          if (currentWeight < ROLE_WEIGHTS.super_admin && currentPermissions.length === 0) {
            denyAccess("暂无权限访问管理后台");
            return;
          }
          applyPermissions();
        })
        .catch(function () {});
    }
  </script>
</body>
</html>
