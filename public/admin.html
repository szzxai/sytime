<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5F3EE" />
    <title>管理后台 · 校园信息网</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/site.css" />
  </head>
  <body data-shell="app">
    <noscript
      ><div class="alert alert--warning">
        <div class="alert__body">本站需要启用 JavaScript 才能正常使用。</div>
      </div></noscript
    >
    <a class="skip-link" href="#main">跳到正文</a>
    <div id="siteBanner"></div>
    <div id="siteHeader"></div>
    <main id="main" class="main container container--wide">
      <div class="page-head">
        <h1 class="page-head__title" id="adminTitle">管理后台</h1>
      </div>
      <div id="adminStatus"></div>
      <div class="shell" id="adminShell" hidden>
        <nav class="side-nav" aria-label="后台分类" id="adminNav">
          <span class="side-nav__group">内容</span
          ><button
            type="button"
            class="side-nav__item"
            data-panel="banner"
            hidden
          >
            <svg class="icon" aria-hidden="true">
              <use href="/img/icons.svg#i-megaphone"></use></svg
            >编辑横幅</button
          ><button
            type="button"
            class="side-nav__item"
            data-panel="announce"
            hidden
          >
            <svg class="icon" aria-hidden="true">
              <use href="/img/icons.svg#i-mail"></use></svg
            >更新公告</button
          ><button
            type="button"
            class="side-nav__item"
            data-panel="weekly"
            hidden
          >
            <svg class="icon" aria-hidden="true">
              <use href="/img/icons.svg#i-utensils"></use></svg
            >每周菜谱管理</button
          ><span class="side-nav__group">审核</span
          ><button
            type="button"
            class="side-nav__item"
            data-panel="review"
            hidden
          >
            <svg class="icon" aria-hidden="true">
              <use href="/img/icons.svg#i-graduation"></use></svg
            >学生认证审核<span
              class="side-nav__count"
              data-count="review"
              hidden
            ></span></button
          ><button
            type="button"
            class="side-nav__item"
            data-panel="appeals"
            hidden
          >
            <svg class="icon" aria-hidden="true">
              <use href="/img/icons.svg#i-shield"></use></svg
            >申诉处理<span
              class="side-nav__count"
              data-count="appeals"
              hidden
            ></span></button
          ><button
            type="button"
            class="side-nav__item"
            data-panel="tickets"
            hidden
          >
            <svg class="icon" aria-hidden="true">
              <use href="/img/icons.svg#i-clipboard"></use></svg
            >工单管理<span
              class="side-nav__count"
              data-count="tickets"
              hidden
            ></span></button
          ><span class="side-nav__group">用户</span
          ><button
            type="button"
            class="side-nav__item"
            data-panel="users"
            hidden
          >
            <svg class="icon" aria-hidden="true">
              <use href="/img/icons.svg#i-users"></use></svg
            >用户管理</button
          ><button
            type="button"
            class="side-nav__item"
            data-panel="invite"
            hidden
          >
            <svg class="icon" aria-hidden="true">
              <use href="/img/icons.svg#i-tag"></use></svg
            >邀请码设置
          </button>
        </nav>
        <div class="shell__main" id="contentArea">
          <section class="view" id="view-banner" hidden>
            <form id="bannerForm" novalidate>
              <div class="panel">
                <div class="panel__head">
                  <h2 class="panel__title">全站横幅</h2>
                </div>
                <div class="panel__body form">
                  <div class="field">
                    <label class="field__label" for="bannerInput"
                      >横幅文本</label
                    ><input
                      class="input"
                      type="text"
                      id="bannerInput"
                      name="bannerInput"
                      data-counter="100"
                    />
                    <div class="field__foot">
                      <span class="field__hint"
                        >显示在每个页面顶部，留空则不显示。</span
                      ><span class="field__counter"></span>
                    </div>
                  </div>
                </div>
                <div class="panel__foot">
                  <span class="status-text" id="bannerMsg" role="status"></span
                  ><button type="button" class="btn" id="bannerClear">
                    取消横幅</button
                  ><button
                    type="submit"
                    class="btn btn--primary"
                    id="bannerSubmit"
                  >
                    确认修改
                  </button>
                </div>
              </div>
            </form>
          </section>
          <section class="view" id="view-announce" hidden>
            <form id="annForm" novalidate>
              <div class="panel">
                <div class="panel__head">
                  <h2 class="panel__title">发布公告</h2>
                </div>
                <div class="panel__body form">
                  <div class="field">
                    <label class="field__label" for="annTitle">公告标题</label
                    ><input
                      class="input"
                      type="text"
                      id="annTitle"
                      name="annTitle"
                      required
                      data-counter="60"
                    />
                    <div class="field__foot">
                      <span class="field__hint"></span
                      ><span class="field__counter"></span>
                    </div>
                  </div>
                  <div class="field">
                    <label class="field__label" for="annContent">公告内容</label
                    ><textarea
                      class="textarea"
                      id="annContent"
                      name="annContent"
                      required
                      data-counter="2000"
                    ></textarea>
                    <div class="field__foot">
                      <span class="field__hint"></span
                      ><span class="field__counter"></span>
                    </div>
                  </div>
                </div>
                <div class="panel__foot">
                  <span class="status-text" id="annMsg" role="status"></span
                  ><button
                    type="submit"
                    class="btn btn--primary"
                    id="annSubmit"
                  >
                    发布公告
                  </button>
                </div>
              </div>
            </form>
          </section>
          <section class="view" id="view-weekly" hidden>
            <form id="weeklyForm" novalidate>
              <div class="panel">
                <div class="panel__head">
                  <h2 class="panel__title">上传菜谱图片</h2>
                </div>
                <div class="panel__body form">
                  <div class="form-grid form-grid--2">
                    <div class="field">
                      <label class="field__label" for="weeklyStart"
                        >第一天</label
                      ><input
                        class="input"
                        type="date"
                        id="weeklyStart"
                        name="weeklyStart"
                        required
                      />
                      <div class="field__foot">
                        <span class="field__hint"></span>
                      </div>
                    </div>
                    <div class="field">
                      <label class="field__label" for="weeklyEnd"
                        >最后一天</label
                      ><input
                        class="input"
                        type="date"
                        id="weeklyEnd"
                        name="weeklyEnd"
                        required
                      />
                      <div class="field__foot">
                        <span class="field__hint"></span>
                      </div>
                    </div>
                  </div>
                  <button type="button" class="btn" id="weeklyChoose">
                    <svg class="icon" aria-hidden="true">
                      <use href="/img/icons.svg#i-upload"></use></svg
                    >选择图片</button
                  ><input
                    type="file"
                    id="weeklyFile"
                    accept="image/jpeg,image/png"
                    hidden
                  />
                  <div id="weeklyPreview" class="stack" hidden>
                    <div class="upload-preview">
                      <img
                        class="upload-preview__img"
                        id="weeklyPreviewImg"
                        alt="食谱预览"
                      />
                      <div class="upload-preview__meta">
                        <div
                          class="upload-preview__name"
                          id="weeklyPreviewName"
                        ></div>
                        <div
                          class="upload-preview__size"
                          id="weeklyPreviewSize"
                        ></div>
                      </div>
                    </div>
                    <div class="row row--sm">
                      <button
                        type="submit"
                        class="btn btn--primary"
                        id="weeklyConfirm"
                      >
                        确认上传</button
                      ><button type="button" class="btn" id="weeklyCancel">
                        取消
                      </button>
                    </div>
                  </div>
                  <span class="field__hint">JPG / PNG，不超过 5 MB</span>
                </div>
              </div>
            </form>
            <h2 class="section__title u-mb-4">已上传菜谱</h2>
            <div id="weeklyList" class="queue-list" aria-live="polite"></div>
          </section>
          <section class="view" id="view-review" hidden>
            <div id="reviewList" class="queue-list" aria-live="polite"></div>
          </section>
          <section class="view" id="view-appeals" hidden>
            <div id="appealList" class="queue-list" aria-live="polite"></div>
          </section>
          <section class="view" id="view-tickets" hidden>
            <div id="ticketList" class="queue-list" aria-live="polite"></div>
          </section>
          <section class="view" id="view-users" hidden>
            <div id="userList"></div>
          </section>
          <section class="view" id="view-invite" hidden>
            <form id="inviteForm" novalidate>
              <div class="panel">
                <div class="panel__head">
                  <h2 class="panel__title">添加邀请码</h2>
                  <p class="panel__desc">
                    学生认证时填入有效邀请码可直接通过；次数用完后失效。
                  </p>
                </div>
                <div class="panel__body form">
                  <div class="form-grid form-grid--2">
                    <div class="field">
                      <label class="field__label" for="inviteCodeInput"
                        >邀请码</label
                      ><input
                        class="input"
                        type="text"
                        id="inviteCodeInput"
                        name="inviteCodeInput"
                        required
                      />
                      <div class="field__foot">
                        <span class="field__hint"></span>
                      </div>
                    </div>
                    <div class="field">
                      <label class="field__label" for="inviteMaxInput"
                        >可用次数</label
                      ><input
                        class="input"
                        type="number"
                        id="inviteMaxInput"
                        name="inviteMaxInput"
                        min="0"
                        step="1"
                        value="0"
                      />
                      <div class="field__foot">
                        <span class="field__hint">0 为不限</span>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="panel__foot">
                  <span class="status-text" id="inviteMsg" role="status"></span
                  ><button
                    type="submit"
                    class="btn btn--primary"
                    id="inviteAdd"
                  >
                    添加
                  </button>
                </div>
              </div>
            </form>
            <h2 class="section__title u-mb-4">已有邀请码</h2>
            <div id="inviteList" class="queue-list" aria-live="polite"></div>
          </section>
        </div>
      </div>
      <div id="denyBox" hidden></div>
      <dialog
        class="dialog dialog--sheet dialog--wide"
        id="banModal"
        aria-labelledby="banModal-t"
      >
        <form class="dialog__form" id="banForm" novalidate>
          <div class="dialog__head">
            <h2 class="dialog__title" id="banModal-t">
              封禁用户 <span id="banTargetName"></span>
            </h2>
            <button
              type="button"
              class="icon-btn icon-btn--sm"
              data-dialog-close
              aria-label="关闭"
            >
              <svg class="icon" aria-hidden="true">
                <use href="/img/icons.svg#i-close"></use>
              </svg>
            </button>
          </div>
          <div class="dialog__body stack">
            <div class="field">
              <label class="field__label" for="banReasonInput"
                >封禁理由（选填）</label
              ><input
                class="input"
                type="text"
                id="banReasonInput"
                name="banReasonInput"
                data-counter="100"
              />
              <div class="field__foot">
                <span class="field__hint"></span
                ><span class="field__counter"></span>
              </div>
            </div>
            <div
              class="field"
              data-upload
              data-max-mb="5"
              data-types="image/jpeg,image/png"
            >
              <span class="field__label">图片（选填）</span
              ><label class="upload"
                ><span class="upload__icon"
                  ><svg class="icon icon--lg" aria-hidden="true">
                    <use href="/img/icons.svg#i-image"></use></svg></span
                ><span class="upload__title">点击选择或拖入图片</span
                ><span class="upload__hint">JPG / PNG，不超过 5 MB</span
                ><input
                  type="file"
                  id="banImageInput"
                  aria-label="上传图片"
                  accept="image/jpeg,image/png"
              /></label>
              <div class="upload-preview-slot"></div>
            </div>
            <label class="check-row"
              ><input
                type="checkbox"
                class="check"
                id="banAllowAppeal"
                checked
              /><span class="check-row__text"
                >允许申请解封<span class="check-row__desc"
                  >关闭后该用户只能线下联系超级管理员</span
                ></span
              ></label
            >
          </div>
          <div class="dialog__foot">
            <span class="status-text" id="banMsg" role="status"></span
            ><button type="button" class="btn" data-dialog-close>取消</button
            ><button type="submit" class="btn btn--danger" id="banConfirm">
              确认封禁
            </button>
          </div>
        </form>
      </dialog>
      <dialog
        class="dialog dialog--sheet dialog--wide"
        id="rejectModal"
        aria-labelledby="rejectModal-t"
      >
        <form class="dialog__form" id="rejectForm" novalidate>
          <div class="dialog__head">
            <h2 class="dialog__title" id="rejectModal-t">拒绝学生认证</h2>
            <button
              type="button"
              class="icon-btn icon-btn--sm"
              data-dialog-close
              aria-label="关闭"
            >
              <svg class="icon" aria-hidden="true">
                <use href="/img/icons.svg#i-close"></use>
              </svg>
            </button>
          </div>
          <div class="dialog__body stack">
            <div class="field">
              <label class="field__label" for="rejectReasonInput"
                >拒绝原因（选填）</label
              ><input
                class="input"
                type="text"
                id="rejectReasonInput"
                name="rejectReasonInput"
                data-counter="100"
              />
              <div class="field__foot">
                <span class="field__hint"></span
                ><span class="field__counter"></span>
              </div>
            </div>
          </div>
          <div class="dialog__foot">
            <span class="status-text" id="rejectMsg" role="status"></span
            ><button type="button" class="btn" data-dialog-close>取消</button
            ><button type="submit" class="btn btn--primary" id="rejectConfirm">
              确认拒绝
            </button>
          </div>
        </form>
      </dialog>
      <dialog
        class="dialog dialog--sheet dialog--wide"
        id="permsModal"
        aria-labelledby="permsModal-t"
      >
        <form class="dialog__form" id="permsForm" novalidate>
          <div class="dialog__head">
            <h2 class="dialog__title" id="permsModal-t">
              设置权限 <span id="permsTargetName"></span>
            </h2>
            <button
              type="button"
              class="icon-btn icon-btn--sm"
              data-dialog-close
              aria-label="关闭"
            >
              <svg class="icon" aria-hidden="true">
                <use href="/img/icons.svg#i-close"></use>
              </svg>
            </button>
          </div>
          <div class="dialog__body stack">
            <div id="permsList" class="stack"></div>
          </div>
          <div class="dialog__foot">
            <span class="status-text" id="permsMsg" role="status"></span
            ><button type="button" class="btn" data-dialog-close>取消</button
            ><button type="submit" class="btn btn--primary" id="permsConfirm">
              保存
            </button>
          </div>
        </form>
      </dialog>
      <dialog
        class="dialog dialog--sheet dialog--wide"
        id="ticketModal"
        aria-labelledby="ticketModal-t"
      >
        <form class="dialog__form" id="ticketReplyForm" novalidate>
          <div class="dialog__head">
            <h2 class="dialog__title" id="ticketModal-t">
              批复工单 <span id="ticketTargetTitle"></span>
            </h2>
            <button
              type="button"
              class="icon-btn icon-btn--sm"
              data-dialog-close
              aria-label="关闭"
            >
              <svg class="icon" aria-hidden="true">
                <use href="/img/icons.svg#i-close"></use>
              </svg>
            </button>
          </div>
          <div class="dialog__body stack">
            <div class="field">
              <label class="field__label" for="ticketReplyInput">批复内容</label
              ><textarea
                class="textarea"
                id="ticketReplyInput"
                name="ticketReplyInput"
                required
                data-counter="2000"
              ></textarea>
              <div class="field__foot">
                <span class="field__hint"></span
                ><span class="field__counter"></span>
              </div>
            </div>
            <div
              class="field"
              data-upload
              data-max-mb="5"
              data-types="image/jpeg,image/png"
            >
              <span class="field__label">图片（选填）</span
              ><label class="upload"
                ><span class="upload__icon"
                  ><svg class="icon icon--lg" aria-hidden="true">
                    <use href="/img/icons.svg#i-image"></use></svg></span
                ><span class="upload__title">点击选择或拖入图片</span
                ><span class="upload__hint">JPG / PNG，不超过 5 MB</span
                ><input
                  type="file"
                  id="ticketImageInput"
                  aria-label="上传图片"
                  accept="image/jpeg,image/png"
              /></label>
              <div class="upload-preview-slot"></div>
            </div>
          </div>
          <div class="dialog__foot">
            <span class="status-text" id="ticketMsg" role="status"></span
            ><button type="button" class="btn" data-dialog-close>取消</button
            ><button type="submit" class="btn btn--primary" id="ticketConfirm">
              提交批复
            </button>
          </div>
        </form>
      </dialog>
    </main>

    <script src="/js/ui.js"></script>
    <script src="/js/page.js"></script>
    <script src="/js/pages/admin.js"></script>
  </body>
</html>
