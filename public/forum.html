<!doctype html>
<html lang="zh-CN">
  <head>
  <script src="/js/page-transition.js"></script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#218653" />
    <title>论坛 · 拾光酥糕</title>
    <link rel="icon" href="/img/brand-lime.svg?v=20261019" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/site.css?v=shstime-20261019" />
  </head>
  <body data-page="forum" data-nav="forum">
    <noscript
      ><div class="alert alert--warning">
        <div class="alert__body">本站需要启用 JavaScript 才能正常使用。</div>
      </div></noscript
    >
    <a class="skip-link" href="#main">跳到正文</a>
    <div id="siteBanner"></div>
    <div id="siteHeader"></div>
    <main id="main" class="workspace workspace--forum">
      <aside class="workspace__sidebar" aria-label="论坛分类">
      <div class="page-head">
        <div class="page-head__main">
          <span class="page-head__eyebrow">校园交流</span>
          <h1 class="page-head__title">论坛</h1>
        </div>
        <div class="page-head__actions">
          <button type="button" class="btn btn--primary" id="newPostBtn">
            <svg class="icon" aria-hidden="true">
              <use href="/img/icons.svg#i-plus"></use></svg
            >发布帖子
          </button>
        </div>
      </div>

      <div class="segmented u-mb-6" role="tablist" aria-label="分类">
        <button
          type="button"
          class="segmented__item"
          role="tab"
          id="discussBtn"
          data-cat="讨论"
          aria-selected="true"
        >
          讨论
        </button>
        <button
          type="button"
          class="segmented__item"
          role="tab"
          id="questionBtn"
          data-cat="提问"
          aria-selected="false"
        >
          提问
        </button>
      </div>

      <div class="callout" id="loginHint" hidden>
        <span class="callout__text">登录后才能发布帖子、点赞和回复。</span>
        <span class="callout__actions"
          ><a class="btn btn--sm" href="login.html">登录</a
          ><a class="btn btn--primary btn--sm" href="register.html"
            >注册</a
          ></span
        >
      </div>

      </aside>
      <div class="workspace__content">
      <div class="stack stack--md" id="postList" aria-live="polite"></div>
      <div class="load-more" id="loadMore" hidden>
        <button type="button" class="btn" id="moreBtn">加载更多</button
        ><span id="moreInfo"></span>
      </div>

      </div>
      <dialog
        class="dialog dialog--sheet dialog--wide"
        id="postDialog"
        aria-labelledby="postDialog-t"
      >
        <form class="dialog__form" id="postForm" method="dialog" novalidate>
          <div class="dialog__head">
            <h2 class="dialog__title" id="postDialog-t">发布帖子</h2>
            <button
              type="button"
              class="icon-btn icon-btn--sm"
              data-dialog-close
              aria-label="关闭"
            >
              <svg class="icon" aria-hidden="true">
                <use href="/img/icons.svg#i-close"></use>
              </svg>
            </button>
          </div>
          <div class="dialog__body">
            <div class="field">
              <label class="field__label" for="title">标题</label>
              <input
                class="input"
                id="title"
                type="text"
                required
                data-counter="50"
                enterkeyhint="next"
              />
              <div class="field__foot">
                <span class="field__hint"></span
                ><span class="field__counter"></span>
              </div>
            </div>
            <div class="field">
              <label class="field__label" for="category">分类</label>
              <select class="select" id="category">
                <option value="讨论">讨论</option>
                <option value="提问">提问</option>
              </select>
            </div>
            <div class="field">
              <label class="field__label" for="content">内容</label>
              <textarea
                class="textarea"
                id="content"
                required
                data-counter="2000"
              ></textarea>
              <div class="field__foot">
                <span class="field__hint">支持换行</span
                ><span class="field__counter"></span>
              </div>
            </div>
          </div>
          <div class="dialog__foot">
            <button type="button" class="btn" data-dialog-close>取消</button>
            <button type="submit" class="btn btn--primary" id="postSubmit">
              发布
            </button>
          </div>
        </form>
      </dialog>
    </main>
    <div id="siteFooter"></div>
    <script src="/js/ui.js?v=shstime-20261024-collections"></script>
    <script src="/js/page.js"></script>

    <script src="/js/forum.js"></script>
    <script src="/js/pages/forum.js"></script>
  </body>
</html>
