<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园信息网</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
    color: #000000;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #000000;
    padding: 16px 32px;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .nav {
    display: flex;
    gap: 24px;
  }
  .nav a {
    color: #000000;
    text-decoration: none;
    font-size: 16px;
    padding: 6px 4px;
    border-bottom: 2px solid transparent;
  }
  .nav a:hover {
    border-bottom: 2px solid #000000;
  }
  .auth {
    display: flex;
    gap: 8px;
  }
  .btn {
    display: inline-block;
    background: #ffffff;
    color: #000000;
    border: 2px solid #000000;
    border-radius: 0;
    padding: 8px 14px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    line-height: 1;
  }
  .btn:hover { background: #000000; color: #ffffff; }
  .main {
    height: calc(100% - 63px);
  }
</style>
<script>
  (function () {
    if (location.pathname !== "/" && location.pathname !== "") return;
    function go(target) {
      if (!target || target === "index.html") return;
      location.replace(target);
    }
    var token = localStorage.getItem("token");
    if (token) {
      fetch("/api/user/profile", { headers: { "Authorization": "Bearer " + token } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (d && d.user && d.user.default_page) go(d.user.default_page);
          else go(localStorage.getItem("defaultPage"));
        })
        .catch(function () { go(localStorage.getItem("defaultPage")); });
    } else {
      go(localStorage.getItem("defaultPage"));
    }
  })();
</script>
</head>
<body>
  <header class="header">
    <div class="logo">校园信息网</div>
    <div class="header-right">
      <nav class="nav">
        <a href="index.html">首页</a>
        <a href="map.html">校园地图</a>
        <a href="forum.html">论坛</a>
        <a href="recipe.html">菜谱评价</a>
      </nav>
      <div class="auth" id="authArea">
        <a class="btn" href="login.html">登录</a>
        <a class="btn" href="register.html">注册</a>
      </div>
    </div>
  </header>
  <main class="main"></main>
  <script src="auth.js"></script>
</body>
</html>
