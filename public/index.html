<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园信息网</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #ffffff;
    color: #000000;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #000000;
    padding: 16px 32px;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .nav {
    display: flex;
    gap: 24px;
  }
  .nav a {
    color: #000000;
    text-decoration: none;
    font-size: 16px;
    padding: 6px 4px;
    border-bottom: 2px solid transparent;
  }
  .nav a:hover {
    border-bottom: 2px solid #000000;
  }
  .main {
    height: calc(100% - 63px);
  }
</style>
</head>
<body>
  <header class="header">
    <div class="logo">校园信息网</div>
    <nav class="nav">
      <a href="index.html">首页</a>
      <a href="map.html">校园地图</a>
      <a href="#">关于我们</a>
    </nav>
  </header>
  <main class="main"></main>
</body>
</html>
