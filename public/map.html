<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#085628" />
    <title>校园地图 · 校园信息网</title>
    <link rel="icon" href="/img/favicon.svg?v=su-085628-v3" type="image/svg+xml" />
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/css/site.css" />
  </head>
  <body data-nav="map" data-shell="app" data-page="map">
    <noscript
      ><div class="alert alert--warning">
        <div class="alert__body">本站需要启用 JavaScript 才能正常使用。</div>
      </div></noscript
    >
    <a class="skip-link" href="#map">跳到地图</a>
    <div id="siteBanner"></div>
    <div id="siteHeader"></div>
    <main class="map-page" id="main">
      <h1 class="sr-only">校园地图</h1>
      <div
        id="map"
        class="map-canvas"
        role="application"
        aria-label="校园地图，可用方向键或 W A S D 移动"
      ></div>

      <div class="map-ui map-ui--tr">
        <div class="floor-switch" role="group" aria-label="切换楼层">
          <span class="floor-switch__label">楼层</span>
          <button
            type="button"
            class="floor-switch__btn"
            id="floor4Btn"
            aria-pressed="false"
            onclick="setFloor(4)"
          >
            4F
          </button>
          <button
            type="button"
            class="floor-switch__btn"
            id="floor3Btn"
            aria-pressed="false"
            onclick="setFloor(3)"
          >
            3F
          </button>
          <button
            type="button"
            class="floor-switch__btn"
            id="floor2Btn"
            aria-pressed="false"
            onclick="setFloor(2)"
          >
            2F
          </button>
          <button
            type="button"
            class="floor-switch__btn"
            id="floor1Btn"
            aria-pressed="true"
            onclick="setFloor(1)"
          >
            1F
          </button>
        </div>
      </div>

      <div class="map-ui map-ui--bl">
        <button
          type="button"
          class="icon-btn map-help-btn"
          id="helpBtn"
          aria-label="操作提示"
          aria-expanded="false"
        >
          <svg class="icon" aria-hidden="true">
            <use href="/img/icons.svg#i-help"></use>
          </svg>
        </button>
      </div>
      <div class="map-ui map-ui--bl" id="helpPanel" hidden>
        <div class="map-help">
          <h2 class="map-help__title">操作提示</h2>
          <ul>
            <li>滚轮 / 双指：缩放</li>
            <li>拖动：移动地图</li>
            <li>
              <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向键：移动
            </li>
            <li>点击建筑：查看介绍</li>
          </ul>
        </div>
      </div>

      <div class="map-ui map-ui--center" id="mapStatusWrap">
        <div class="map-status" id="mapStatus">
          <span class="spinner spinner--lg"></span><span>地图加载中…</span>
        </div>
      </div>
    </main>
    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/page.js"></script>

    <script src="/js/pages/map.js"></script>
  </body>
</html>
