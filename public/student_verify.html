<!doctype html>
<html lang="zh-CN">
  <head>
  <script src="/js/page-transition.js"></script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#218653" />
    <title>学生认证 · 拾光酥糕</title>
    <link rel="icon" href="/img/brand-lime.svg?v=20261019" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/site.css?v=shstime-20261019" />
  </head>
  <body data-page="student_verify">
    <noscript
      ><div class="alert alert--warning">
        <div class="alert__body">本站需要启用 JavaScript 才能正常使用。</div>
      </div></noscript
    >
    <a class="skip-link" href="#main">跳到正文</a>
    <div id="siteBanner"></div>
    <div id="siteHeader"></div>
    <main id="main" class="auth container container--form">
      <div class="card auth-card auth-card--wide">
        <h1 class="auth-card__title">学生认证</h1>
        <div id="alreadyBox" class="empty empty--compact" hidden>
          <div class="empty__icon">
            <svg class="icon" aria-hidden="true">
              <use href="/img/icons.svg#i-graduation"></use>
            </svg>
          </div>
          <div class="empty__title">你已认证为学生</div>
        </div>

        <div id="formBox">
          <p class="auth-card__desc">
            提交后由管理员审核；若管理员开启了邀请码，填入正确的邀请码可直接通过。
          </p>
          <form id="applyForm" class="form" novalidate>
            <div class="field">
              <label class="field__label" for="student_id">新生号</label>
              <input
                class="input"
                id="student_id"
                type="text"
                required
                enterkeyhint="next"
              />
            </div>
            <div class="field">
              <label class="field__label" for="class_name">班级</label>
              <input
                class="input"
                id="class_name"
                type="text"
                required
                enterkeyhint="next"
              />
            </div>
            <div class="field">
              <label class="field__label" for="real_name">真实姓名</label>
              <input
                class="input"
                id="real_name"
                type="text"
                required
                enterkeyhint="next"
              />
            </div>
            <div class="field">
              <label class="field__label" for="invite_code"
                >邀请码 <span class="field__opt">（选填）</span></label
              >
              <input
                class="input"
                id="invite_code"
                type="text"
                enterkeyhint="next"
              />
              <div class="field__hint">
                如果管理员开启了邀请码，填入可直接通过审核
              </div>
            </div>
            <div class="field">
              <label class="field__label" for="extra_info"
                >补充更多信息 <span class="field__opt">（选填）</span></label
              >
              <textarea
                class="textarea"
                id="extra_info"
                data-counter="200"
              ></textarea>
              <div class="field__foot">
                <span class="field__hint">补充更多信息可提高通过率</span
                ><span class="field__counter"></span>
              </div>
            </div>
            <button
              type="submit"
              class="btn btn--primary btn--lg btn--block"
              id="submitBtn"
            >
              提交认证
            </button>
            <div class="field__hint u-center">
              重复提交将覆盖上一次申请；10 分钟内只能提交一次。
            </div>
          </form>
        </div>
      </div>
    </main>
    <div id="siteFooter"></div>
    <script src="/js/ui.js?v=shstime-20261019"></script>
    <script src="/js/page.js"></script>

    <script src="/js/pages/student_verify.js"></script>
  </body>
</html>
