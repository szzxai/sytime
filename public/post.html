<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帖子详情 · 校园信息网</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #000000;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #000000;
    padding: 16px 32px;
  }
  .logo {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .nav {
    display: flex;
    gap: 24px;
  }
  .nav a {
    color: #000000;
    text-decoration: none;
    font-size: 16px;
    padding: 6px 4px;
    border-bottom: 2px solid transparent;
  }
  .nav a:hover { border-bottom: 2px solid #000000; }
  .auth {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn {
    display: inline-block;
    background: #ffffff;
    color: #000000;
    border: 2px solid #000000;
    border-radius: 0;
    padding: 8px 14px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    line-height: 1;
  }
  .btn:hover { background: #000000; color: #ffffff; }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 16px 56px;
  }
  .back {
    display: inline-block;
    font-size: 13px;
    color: #555555;
    text-decoration: none;
    margin-bottom: 14px;
  }
  .back:hover { text-decoration: underline; }
  .post { border: 2px solid #000000; padding: 16px; }
  .post-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }
  .post-title { font-size: 16px; font-weight: bold; }
  .tag {
    flex: none;
    font-size: 12px;
    border: 1px solid #000000;
    padding: 2px 8px;
  }
  .post-meta { font-size: 12px; color: #777777; margin-bottom: 10px; }
  .post-content {
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .post-actions { margin-top: 12px; display: flex; align-items: center; gap: 16px; }
  .like-btn {
    background: #ffffff;
    color: #000000;
    border: 2px solid #000000;
    border-radius: 0;
    padding: 4px 12px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .like-btn:hover { background: #000000; color: #ffffff; }
  .like-btn.active { background: #000000; color: #ffffff; }
  .replies {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed #cccccc;
  }
  .replies-title {
    font-size: 15px;
    letter-spacing: 1px;
    margin: 0 0 12px;
  }
  .reply-list { display: flex; flex-direction: column; gap: 10px; }
  .reply-meta { font-size: 12px; color: #777777; margin-bottom: 2px; }
  .reply-content {
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .reply-form { margin-top: 12px; }
  .reply-form textarea {
    width: 100%;
    border: 2px solid #000000;
    border-radius: 0;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    color: #000000;
    background: #ffffff;
    min-height: 64px;
    resize: vertical;
    outline: none;
    margin-bottom: 10px;
  }
  .submit {
    background: #000000;
    color: #ffffff;
    border: 2px solid #000000;
    border-radius: 0;
    padding: 10px 22px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  .submit:hover { background: #ffffff; color: #000000; }
  .submit:disabled { opacity: 0.5; cursor: default; }
  .msg { min-height: 18px; font-size: 13px; margin-top: 12px; }
  .msg.error { color: #cc0000; }
  .msg.ok { color: #008800; }
  .login-hint-sm { margin-top: 12px; font-size: 13px; color: #777777; }
  .login-hint-sm a { color: #000000; }
  .link-btn {
    background: none;
    border: none;
    padding: 0;
    font-size: 13px;
    font-family: inherit;
    color: #000000;
    text-decoration: underline;
    cursor: pointer;
  }
  .empty-sm { font-size: 13px; color: #888888; }
  .empty {
    font-size: 14px;
    color: #777777;
    text-align: center;
    padding: 24px;
    border: 2px dashed #dddddd;
  }
</style>
</head>
<body>
  <header class="header">
    <div class="logo">校园信息网</div>
    <div class="header-right">
      <nav class="nav">
        <a href="map.html">校园地图</a>
        <a href="forum.html">论坛</a>
        <a href="recipe.html">菜谱评价</a>
        <a href="announcements.html">更新公告</a>
      </nav>
      <div class="auth" id="authArea">
        <a class="btn" href="login.html">登录</a>
        <a class="btn" href="register.html">注册</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="detail"><div class="empty">加载中…</div></div>
  </main>

  <script src="auth.js"></script>
  <script>
    var token = localStorage.getItem("token");
    var postId = new URLSearchParams(location.search).get("id");
    var detail = document.getElementById("detail");

    function escapeHtml(value) {
      if (value === null || value === undefined) return "";
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatTime(sec) {
      var d = new Date(Number(sec) * 1000);
      function p(n) { return n < 10 ? "0" + n : "" + n; }
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
    }

    function renderPost(p) {
      var replyArea = token
        ? '<div class="reply-form">' +
            '<textarea id="replyInput" placeholder="写下你的回复…"></textarea>' +
            '<button type="button" class="submit" id="replySubmit">发布回复</button>' +
            '<div class="msg" id="replyMsg"></div>' +
          '</div>'
        : '<div class="login-hint-sm">请先登录后回复　<a href="login.html">前往登录</a></div>';
      detail.innerHTML =
        '<a class="back" href="forum.html">← 返回论坛</a>' +
        '<div class="post" data-post-id="' + p.id + '">' +
          '<div class="post-head">' +
            '<span class="post-title">' + escapeHtml(p.title) + '</span>' +
            '<span class="tag">' + escapeHtml(p.category) + '</span>' +
          '</div>' +
          '<div class="post-meta">' + escapeHtml(p.username) + ' · ' + formatTime(p.created_at) + '</div>' +
          '<div class="post-content">' + escapeHtml(p.content) + '</div>' +
          '<div class="post-actions">' +
            '<button type="button" class="like-btn' + (p.is_liked ? ' active' : '') + '" data-like-toggle>👍 点赞（<span data-like-count>' + (p.like_count || 0) + '</span>）</button>' +
            '<button type="button" class="link-btn" data-replies-toggle>回复</button>' +
          '</div>' +
          '<div class="replies" id="repliesBox">' +
            '<h2 class="replies-title">回复</h2>' +
            '<div class="reply-list" id="replyList"><div class="empty-sm">加载中…</div></div>' +
            replyArea +
          '</div>' +
        '</div>';
    }

    function loadReplies() {
      var box = document.getElementById("replyList");
      if (!box) return;
      fetch("/api/forum/posts/" + encodeURIComponent(postId) + "/replies")
        .then(function (res) { return res.json(); })
        .then(function (data) {
          var replies = data.replies || [];
          if (!replies.length) {
            box.innerHTML = '<div class="empty-sm">还没有回复</div>';
            return;
          }
          box.innerHTML = replies.map(function (r) {
            return '<div class="reply">' +
              '<div class="reply-meta">' + escapeHtml(r.username) + ' · ' + formatTime(r.created_at) + '</div>' +
              '<div class="reply-content">' + escapeHtml(r.content) + '</div>' +
            '</div>';
          }).join("");
        })
        .catch(function (err) {
          box.innerHTML = '<div class="empty-sm">加载失败：' + escapeHtml(err.message) + '</div>';
        });
    }

    function bindReply() {
      var btn = document.getElementById("replySubmit");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var input = document.getElementById("replyInput");
        var msg = document.getElementById("replyMsg");
        var content = input.value.trim();
        if (!content) {
          msg.className = "msg error";
          msg.textContent = "回复内容不能为空";
          return;
        }
        msg.className = "msg";
        msg.textContent = "发布中…";
        btn.disabled = true;
        fetch("/api/forum/posts/" + encodeURIComponent(postId) + "/replies", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ content: content })
        })
          .then(function (res) {
            return res.json().then(function (data) { return { ok: res.ok, data: data }; });
          })
          .then(function (r) {
            btn.disabled = false;
            if (!r.ok) {
              msg.className = "msg error";
              msg.textContent = r.data.error === "login required" ? "请先登录" : (r.data.error || "发布失败");
              return;
            }
            input.value = "";
            msg.className = "msg ok";
            msg.textContent = "回复成功";
            loadReplies();
          })
          .catch(function (err) {
            btn.disabled = false;
            msg.className = "msg error";
            msg.textContent = "网络错误：" + err.message;
          });
      });
    }

    function toggleLike(btn) {
      if (!token) {
        alert("请先登录");
        return;
      }
      var countEl = btn.querySelector("[data-like-count]");
      var liked = btn.classList.contains("active");
      btn.disabled = true;
      fetch("/api/forum/posts/" + encodeURIComponent(postId) + "/like", {
        method: liked ? "DELETE" : "POST",
        headers: { "Authorization": "Bearer " + token }
      })
        .then(function (res) {
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        })
        .then(function (r) {
          btn.disabled = false;
          if (!r.ok) {
            if (r.data && r.data.error === "login required") { alert("请先登录"); return; }
            alert((r.data && r.data.error) || "操作失败");
            return;
          }
          if (r.data && typeof r.data.like_count === "number") {
            countEl.textContent = String(r.data.like_count);
          } else {
            countEl.textContent = String(Math.max(0, parseInt(countEl.textContent, 10) + (liked ? -1 : 1)));
          }
          btn.classList.toggle("active", !liked);
        })
        .catch(function (err) {
          btn.disabled = false;
          alert("网络错误：" + err.message);
        });
    }

    detail.addEventListener("click", function (e) {
      var likeBtn = e.target.closest ? e.target.closest("[data-like-toggle]") : null;
      if (likeBtn) { toggleLike(likeBtn); return; }
      var toggle = e.target.closest ? e.target.closest("[data-replies-toggle]") : null;
      if (toggle) {
        var box = document.getElementById("repliesBox");
        if (!box) return;
        var willShow = box.style.display === "none";
        box.style.display = willShow ? "block" : "none";
        if (willShow && !box.getAttribute("data-loaded")) {
          box.setAttribute("data-loaded", "1");
          loadReplies();
        }
      }
    });

    function loadPost() {
      if (!postId) {
        detail.innerHTML = '<div class="empty">缺少帖子 id</div>';
        return;
      }
      fetch("/api/forum/posts/" + encodeURIComponent(postId), token ? { headers: { "Authorization": "Bearer " + token } } : undefined)
        .then(function (res) {
          return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
        })
        .then(function (r) {
          if (!r.ok) {
            detail.innerHTML = '<div class="empty">' + (r.status === 404 ? "帖子不存在或已删除" : "加载失败") + '</div>';
            return;
          }
          renderPost(r.data.post);
          bindReply();
          var box = document.getElementById("repliesBox");
          if (box) {
            box.setAttribute("data-loaded", "1");
            loadReplies();
          }
        })
        .catch(function (err) {
          detail.innerHTML = '<div class="empty">加载失败：' + escapeHtml(err.message) + '</div>';
        });
    }

    renderAuth();
    loadPost();
  </script>
</body>
</html>
