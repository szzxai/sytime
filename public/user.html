<!doctype html>
<html lang="zh-CN">
  <head>
  <script src="/js/page-transition.js"></script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#218653" />
    <title>用户主页 · 拾光酥糕</title>
    <link rel="icon" href="/img/brand-lime.svg?v=20261019" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/site.css?v=shstime-20261019" />
  </head>
  <body data-page="user">
    <noscript
      ><div class="alert alert--warning">
        <div class="alert__body">本站需要启用 JavaScript 才能正常使用。</div>
      </div></noscript
    >
    <a class="skip-link" href="#main">跳到正文</a>
    <div id="siteBanner"></div>
    <div id="siteHeader"></div>
    <main id="main" class="main container">
      <div id="userStatus"></div>
      <header class="profile-hero" id="userHero" hidden>
        <span class="profile-hero__avatar" id="heroAvatar"></span>
        <div class="profile-hero__info">
          <div class="profile-hero__row">
            <h1 class="profile-hero__username" id="heroUsername">—</h1>
            <span id="heroRole"></span>
            <span class="profile-hero__nickname" id="heroNickname"></span>
          </div>
          <div class="profile-hero__row">
            <span class="profile-hero__signature" id="heroSignature"></span>
          </div>
        </div>
      </header>
      <nav class="profile-tabs" aria-label="用户主页分区" id="userNav" hidden>
        <a class="side-nav__item" href="#home" data-panel="home"
          ><svg class="icon" aria-hidden="true">
            <use href="/img/icons.svg#i-home"></use></svg
          >主页</a
        ><a
          class="side-nav__item"
          href="#favorites"
          data-panel="favorites"
          id="favoritesNav"
          hidden
          ><svg class="icon" aria-hidden="true">
            <use href="/img/icons.svg#i-star"></use></svg
          >收藏</a
        ><a
          class="side-nav__item"
          href="#titles"
          data-panel="titles"
          id="titlesNav"
          ><svg class="icon" aria-hidden="true">
            <use href="/img/icons.svg#i-award"></use></svg
          >头衔</a
        ><a
          class="side-nav__item"
          href="#manage"
          data-panel="manage"
          id="manageNav"
          hidden
          ><svg class="icon" aria-hidden="true">
            <use href="/img/icons.svg#i-shield"></use></svg
          >管理</a
        >
      </nav>
      <div id="userViews">
        <section class="view" id="view-home" hidden></section>
        <section class="view" id="view-favorites" hidden></section>
        <section class="view" id="view-titles" hidden>
          <div class="panel">
            <div class="panel__head">
              <h2 class="panel__title">头衔</h2>
              <p class="panel__desc">该用户已获得的全部头衔。</p>
            </div>
            <div class="panel__body" id="userTitles"></div>
          </div>
        </section>
        <section class="view" id="view-manage" hidden>
          <div id="manageBox"></div>
        </section>
      </div>
    </main>
    <div id="siteFooter"></div>
    <script src="/js/ui.js?v=shstime-20261019"></script>
    <script src="/js/page.js"></script>
    <script src="/js/collections-view.js"></script>
    <script src="/js/pages/user.js"></script>
  </body>
</html>
