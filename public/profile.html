<!doctype html>
<html lang="zh-CN">
  <head>
  <script src="/js/page-transition.js"></script>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#218653" />
    <title>个人中心 · 拾光酥糕</title>
    <link rel="icon" href="/img/suzhou-high-school-mark.png?v=20261018" type="image/png" />
    <link rel="stylesheet" href="/css/site.css?v=shstime-20261018" />
  </head>
  <body data-page="profile">
    <noscript
      ><div class="alert alert--warning">
        <div class="alert__body">本站需要启用 JavaScript 才能正常使用。</div>
      </div></noscript
    >
    <a class="skip-link" href="#main">跳到正文</a>
    <div id="siteBanner"></div>
    <div id="siteHeader"></div>
    <main id="main" class="main container">
      <div id="profileStatus"></div>
      <header class="profile-hero">
        <span class="avatar-edit profile-hero__avatar"
          ><span id="avatarBox"></span
          ><button
            type="button"
            class="avatar-edit__btn"
            id="chooseAvatar"
            aria-label="更换头像"
          >
            <svg class="icon icon--sm" aria-hidden="true">
              <use href="/img/icons.svg#i-pencil"></use>
            </svg></button
          ><input
            type="file"
            id="avatarFile"
            accept="image/jpeg,image/png"
            hidden
        /></span>
        <div class="profile-hero__info">
          <div class="profile-hero__row">
            <h1 class="profile-hero__username" id="heroUsername">—</h1>
            <span id="heroRole"></span>
            <span
              class="profile-hero__edit"
              id="heroNickname"
              contenteditable="true"
              role="textbox"
              aria-label="昵称，点击编辑"
              spellcheck="false"
              data-placeholder="设置昵称"
            ></span>
          </div>
          <div class="profile-hero__row">
            <span
              class="profile-hero__edit profile-hero__edit--sig"
              id="heroSignature"
              contenteditable="true"
              role="textbox"
              aria-label="个性签名，点击编辑"
              spellcheck="false"
              data-placeholder="填写个性签名"
            ></span>
          </div>
        </div>
      </header>
      <nav class="profile-tabs" aria-label="个人中心分区" id="profileNav">
        <a class="side-nav__item" href="#home" data-panel="home"
          ><svg class="icon" aria-hidden="true">
            <use href="/img/icons.svg#i-home"></use></svg
          >主页</a
        ><a class="side-nav__item" href="#favorites" data-panel="favorites"
          ><svg class="icon" aria-hidden="true">
            <use href="/img/icons.svg#i-star"></use></svg
          >收藏</a
        ><a
          class="side-nav__item"
          href="#titles"
          data-panel="titles"
          id="titlesNav"
          ><svg class="icon" aria-hidden="true">
            <use href="/img/icons.svg#i-award"></use></svg
          >头衔</a
        ><a class="side-nav__item" href="settings.html"
          ><svg class="icon" aria-hidden="true">
            <use href="/img/icons.svg#i-settings"></use></svg
          >设置</a
        >
      </nav>
      <section class="view" id="view-home" hidden></section>
      <section class="view" id="view-favorites" hidden></section>
      <section class="view" id="view-titles" hidden>
          <div class="panel">
            <div class="panel__head">
              <h2 class="panel__title">选择佩戴</h2>
              <p class="panel__desc">
                同一时间只能佩戴一个头衔；也可以不佩戴。
              </p>
            </div>
            <div class="panel__body stack">
              <div class="title-preview" aria-live="polite">
                <span class="title-preview__label">预览</span>
                <span id="titlePreview"></span>
              </div>
              <div
                class="choice-group choice-group--2"
                id="titleChoices"
              ></div>
              <div id="titlesEmpty"></div>
              <div
                class="choice-group choice-group--2"
                id="titlesLocked"
              ></div>
            </div>
            <div class="panel__foot">
              <span class="status-text" id="wearMsg"></span>
              <button
                type="button"
                class="btn btn--primary"
                id="wearSubmit"
                disabled
              >
                保存佩戴
              </button>
            </div>
          </div>
        </section>
    </main>
    <div id="siteFooter"></div>
    <script src="/js/ui.js?v=shstime-20261018"></script>
    <script src="/js/page.js"></script>
    <script src="/js/collections-view.js"></script>
    <script src="/js/pages/profile.js"></script>
  </body>
</html>
