<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5F3EE" />
    <title>注册 · 校园信息网</title>
    <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/site.css" />
  </head>
  <body>
    <noscript
      ><div class="alert alert--warning">
        <div class="alert__body">本站需要启用 JavaScript 才能正常使用。</div>
      </div></noscript
    >
    <a class="skip-link" href="#main">跳到正文</a>
    <div id="siteBanner"></div>
    <div id="siteHeader"></div>
    <main id="main" class="auth container container--narrow">
      <div class="card auth-card">
        <div class="auth-card__brand">
          <svg class="brand__mark" aria-hidden="true">
            <use href="/img/icons.svg#brand-mark"></use>
          </svg>
        </div>
        <h1 class="auth-card__title">创建账号</h1>
        <p class="auth-card__desc">注册后即可发帖、评价与认证学生</p>
        <form id="registerForm" class="form" autocomplete="on" novalidate>
          <div class="field">
            <label class="field__label" for="username">用户名</label>
            <input
              class="input"
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              enterkeyhint="next"
              required
            />
            <div class="field__hint">注册后不可修改</div>
          </div>
          <div class="field">
            <label class="field__label" for="nickname">昵称</label>
            <input
              class="input"
              id="nickname"
              name="nickname"
              type="text"
              autocomplete="nickname"
              enterkeyhint="next"
              required
              data-counter="20"
            />
            <div class="field__foot">
              <span class="field__hint">最多 20 字</span
              ><span class="field__counter"></span>
            </div>
          </div>
          <div class="field">
            <label class="field__label" for="password">密码</label>
            <div class="input-group">
              <input
                class="input input--end"
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                enterkeyhint="next"
                required
              />
              <div class="input-group__end">
                <button
                  type="button"
                  class="icon-btn icon-btn--sm"
                  data-password-toggle
                  aria-label="显示密码"
                >
                  <svg class="icon" aria-hidden="true">
                    <use href="/img/icons.svg#i-eye"></use>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="field">
            <label class="field__label" for="confirm">确认密码</label>
            <input
              class="input"
              id="confirm"
              name="confirm"
              type="password"
              autocomplete="new-password"
              enterkeyhint="go"
              required
            />
          </div>
          <button
            type="submit"
            class="btn btn--primary btn--lg btn--block"
            id="submitBtn"
          >
            注册
          </button>
        </form>
        <p class="auth-card__switch">
          已有账号？<a href="login.html">立即登录</a>
        </p>
      </div>
    </main>
    <div id="siteFooter"></div>
    <script src="/js/ui.js"></script>
    <script src="/js/page.js"></script>

    <script src="/js/pages/register.js"></script>
  </body>
</html>
